  panes: [
    { id: 'p1', title: 'Dụng cụ', html: `<p>Bấm vào một dụng cụ trên bàn để xem <b>tên</b> và <b>chức năng</b>.</p><div id="info" class="note">Chưa chọn dụng cụ.</div>

  ['Điện từ', 'Đồng hồ đo điện đa năng', 'Đo cường độ dòng điện, hiệu điện thế, điện trở… trong mạch điện một chiều và xoay chiều.', () => { const g = new THREE.Group(); const b = roundBox(.06, .012, .11, .006, plast(0xf5c518, .5)); b.position.y = .006; g.add(b); const lcd = new THREE.Mesh(new THREE.PlaneGeometry(.04, .02), new THREE.MeshStandardMaterial({ map: canvasTex(160, 80, c => { c.fillStyle = '#c9dcc4'; c.fillRect(0, 0, 160, 80); c.fillStyle = '#1b2a1b'; c.font = 'bold 48px monospace'; c.fillText('12.0', 14, 58); }) })); lcd.rotation.x = -Math.PI / 2; lcd.position.set(0, .0125, -.03); g.add(lcd); const knob = new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, .006, 24), plast(0x222222)); knob.position.set(0, .015, .01); g.add(knob); for (const x of [-.018, 0, .018]) { const j = new THREE.Mesh(new THREE.CylinderGeometry(.003, .003, .004, 12), plast(x ? 0xc92a2a : 0x111111)); j.position.set(x, .014, .042); g.add(j); } return g; }],
  ['Điện từ', 'Cuộn dây dẫn có hai đèn LED', 'Hai đèn LED mắc song song, ngược cực với cuộn dây: đèn nào sáng cho biết có dòng điện cảm ứng và chiều của nó.', () => { const g = new THREE.Group(); const c = coil(.022, .07, 22); c.position.y = .025; g.add(c); const bs = roundBox(.1, .006, .06, .002, plast(0x9cc9e8)); bs.position.y = .003; g.add(bs); led(lab, g, [-.02, .006, .025], { color: 0xffe066 }).set(.6); led(lab, g, [.02, .006, .025], { color: 0xff6b6b }).set(0); return g; }],

  ['Chất và sự biến đổi chất', 'Phễu', 'Rót chất lỏng hoặc dùng để lọc.', () => { const m = new THREE.Mesh(lathe([[.0035, 0], [.0035, .05], [.04, .095], [.042, .096], [.038, .095], [.0025, .05], [.0025, 0]], 40), glass(.35)); return m; }],
  ['Chất và sự biến đổi chất', 'Phễu chiết', 'Tách chất theo phương pháp chiết (hai chất lỏng không tan vào nhau).', () => { const g = new THREE.Group(); const p = []; for (let y = 0; y <= .13; y += .005) { const r = y < .07 ? .0035 + y / .07 * .029 : Math.sqrt(Math.max(0, .0325 ** 2 - ((y - .07) * .694) ** 2)); p.push([r + .0015, y + .04]); } const m = new THREE.Mesh(lathe(p, 32), glass(.35)); g.add(m); const st = new THREE.Mesh(new THREE.CylinderGeometry(.0035, .0025, .04, 12), glass(.4)); st.position.y = .02; g.add(st); const tap = new THREE.Mesh(new THREE.BoxGeometry(.025, .005, .005), plast(0x1971c2)); tap.position.y = .035; g.add(tap); return g; }],
  ['Chất và sự biến đổi chất', 'Bình cầu', 'Đựng chất lỏng, pha chế dung dịch, đun nóng, chưng cất.', () => { const v = vessel(lab, { kind: 'flask', R: .035, H: .14, neck: .01 }); v.set({ level: .3, color: 0xcfe8f3, op: .4 }); return v.g; }],
  ['Chất và sự biến đổi chất', 'Lưới tản nhiệt', 'Đặt giữa ngọn lửa và dụng cụ thuỷ tinh để phân tán nhiệt đều khi đun.', () => { const m = new THREE.Mesh(new THREE.BoxGeometry(.1, .002, .1), new THREE.MeshStandardMaterial({ color: 0x9aa3ab, metalness: .7, roughness: .5, transparent: true, map: canvasTex(256, 256, c => { c.fillStyle = '#8a9299'; c.fillRect(0, 0, 256, 256); c.fillStyle = '#e9ecef'; c.beginPath(); c.arc(128, 128, 60, 0, 7); c.fill(); c.strokeStyle = '#555'; for (let i = 0; i < 256; i += 8) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i, 256); c.moveTo(0, i); c.lineTo(256, i); c.stroke(); } }) })); m.position.y = .001; return m; }],
  ['Quan sát nhiễm sắc thể', 'Kính hiển vi và tiêu bản cố định NST', 'Dùng quan sát nhiễm sắc thể. Ở vật kính 100× cần nhỏ dầu soi kính để thấy rõ mẫu vật nhỏ, trong suốt.', () => { const g = new THREE.Group(); const b = roundBox(.1, .015, .13, .006, plast(0xeef0f2)); b.position.y = .0075; g.add(b); const pl = roundBox(.025, .16, .03, .006, plast(0xeef0f2)); pl.position.set(0, .09, -.04); g.add(pl); const st = roundBox(.08, .006, .07, .002, plast(0x2a2e33)); st.position.set(0, .07, .01); g.add(st); const arm = roundBox(.025, .025, .08, .006, plast(0xeef0f2)); arm.position.set(0, .165, -.01); g.add(arm); const tb2 = new THREE.Mesh(new THREE.CylinderGeometry(.011, .011, .07, 20), plast(0xeef0f2)); tb2.position.set(0, .15, .025); g.add(tb2); const ey = new THREE.Mesh(new THREE.CylinderGeometry(.007, .007, .05, 16), plast(0x2a2e33)); ey.rotation.x = -.6; ey.position.set(0, .195, .04); g.add(ey); const ob = new THREE.Mesh(new THREE.CylinderGeometry(.005, .004, .03, 12), MAT.metal(0xd0d4d8, .2)); ob.position.set(0, .105, .025); g.add(ob); return g; }],
];
const items = [];
TL.forEach((t, i) => { const col = i % 5, row = Math.floor(i / 5), p = [-1.05 + col * .17, 0, -.22 + row * .2]; let o = t[3](p); if (o.parent !== scene) { o.position.set(...p); scene.add(o); } lab.shadow(o); items.push(o); const bb = new THREE.Box3().setFromObject(o); const l = lab.label(o, t[1], [0, bb.max.y - o.position.y + .015, 0]); l.element.style.fontSize = '11px'; lab.clickable(o, () => pick(i)); });
const arrow = new THREE.Mesh(new THREE.ConeGeometry(.012, .03, 16), new THREE.MeshBasicMaterial({ color: 0xff7a00 })); arrow.rotation.x = Math.PI; arrow.visible = false; scene.add(arrow);
lab.onTick((dt, t) => { if (arrow.visible) arrow.position.y = arrow.userData.y + Math.sin(t * 4) * .006; });

  const o = items[i], b = new THREE.Box3().setFromObject(o); arrow.visible = true; arrow.position.set((b.min.x + b.max.x) / 2, 0, (b.min.z + b.max.z) / 2); arrow.userData.y = b.max.y + .03;

for (const x of [-.25, .25]) { const s = new THREE.Mesh(new THREE.BoxGeometry(.012, .25, .12), wood); s.position.set(x, .125, 0); shelf.add(s); }
const dark = BS.map(() => 0), bottles = [];
BS.forEach((b, i) => { const g = new THREE.Group(); g.position.set(-.18 + (i % 3) * .18, .012 + Math.floor(i / 3) * .12, 0); shelf.add(g);

  cont.position.y = b[3] ? .012 : .022; g.add(cont);

$('#gs').onclick = () => lab.view(...VIEW.shelf);
// ===== 3. acid – base =====
const REAG = [{ id: 'hcl', n: 'HCl 0,1 M', c: 0xeef6f8, k: 'liq' }, { id: 'h2o', n: 'Nước cất', c: 0xe8f4fa, k: 'liq' }, { id: 'naoh', n: 'NaOH 0,1 M', c: 0xf2f6f8, k: 'liq' }, { id: 'pp', n: 'Phenolphthalein', c: 0xf8f8f8, k: 'drop' }, { id: 'qt', n: 'Quỳ tím (dd)', c: 0x7c4dff, k: 'drop' }, { id: 'zn', n: 'Mẩu kẽm', c: 0x9aa5b1, k: 'sol', solid: { kind: 'chunk', c: 0x9aa5b1, metal: true }, max: 1 }, { id: 'cuo', n: 'Bột CuO', c: 0x222222, k: 'sol', solid: { kind: 'powder', c: 0x1c1c1c }, max: 1 }];
const has = (it, id) => it.find(x => x.id == id);
const pHof = it => { const a = has(it, 'hcl')?.amt || 0, b = has(it, 'naoh')?.amt || 0, w = has(it, 'h2o')?.amt || 0, v = a + b + w; if (!v) return 7; const n = .1 * (a - b); return Math.abs(n) < 1e-6 ? 7 : n > 0 ? -Math.log10(n / v) : 14 + Math.log10(-n / v); };
const mixc = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), clamp(t, 0, 1)).getHex();
function react(it, heat, age) {
  const s = { notes: [], eq: [] }; if (!it.length) return s;
  const a = has(it, 'hcl'), b = has(it, 'naoh'), w = has(it, 'h2o'), v = (a?.amt || 0) + (b?.amt || 0) + (w?.amt || 0), p = pHof(it), acid = v > 0 && p < 6;
  s.color = 0xe6f2f8; s.op = .3;
  if (has(it, 'pp')) { const k = clamp((p - 8.2) / 1.8, 0, 1); s.color = mixc(0xe6f2f8, 0xd6246e, k); s.op = .3 + .5 * k; s.notes.push(k > 0 ? 'Phenolphthalein hoá <b>hồng</b> (môi trường base).' : 'Phenolphthalein <b>không màu</b> (acid hoặc trung tính).'); }
  if (has(it, 'qt')) { s.color = p < 4.5 ? 0xe03131 : p < 7 ? mixc(0xe03131, 0x7e57c2, (p - 4.5) / 2.5) : p < 8.3 ? mixc(0x7e57c2, 0x3b5bdb, (p - 7) / 1.3) : 0x3b5bdb; s.op = .7; s.notes.push(p < 4.5 ? 'Quỳ tím hoá <b>đỏ</b> (acid).' : p > 8.3 ? 'Quỳ tím hoá <b>xanh</b> (base).' : 'Quỳ tím giữ màu tím (gần trung tính).'); }
  if (a && b) s.eq.push('HCl + NaOH → NaCl + H₂O (phản ứng trung hoà)');
  if (has(it, 'zn')) { const left = acid ? clamp(1 - age / 40, .25, 1) : 1; s.solid = { kind: 'chunk', c: 0x9aa5b1, amt: left, metal: true }; if (acid) { s.bubbles = .45; s.notes.push('Mẩu kẽm tan dần, có <b>bọt khí H₂</b> thoát ra.'); s.eq.push('Zn + 2HCl → ZnCl₂ + H₂↑'); } else s.notes.push('Kẽm không phản ứng trong môi trường này.'); }
  if (has(it, 'cuo')) { const k = acid ? clamp(age / 12, 0, 1) : 0; if (k < 1) s.solid = { kind: 'powder', c: 0x1c1c1c, amt: 1 - k }; if (acid) { s.color = mixc(s.color, 0x2bb7c9, k * .8); s.op = .3 + .4 * k; s.notes.push(k < 1 ? 'Bột CuO đen tan dần, dung dịch chuyển <b>xanh lam</b>…' : 'CuO tan hết, dung dịch xanh lam.'); s.eq.push('CuO + 2HCl → CuCl₂ + H₂O'); } else s.notes.push('Bột CuO đen không tan trong nước hoặc base.'); }
  if (v) s.notes.unshift(`pH ≈ ${fmt(p, 1)}: môi trường ${Math.abs(p - 7) < .3 ? 'trung tính' : p < 7 ? 'acid' : 'base'}.`);
  return s;
}
const tubes = ['Ống 1', 'Ống 2', 'Ống 3', 'Ống 4'];
const bench = chemBench(lab, { tubes, reagents: REAG, react, vol: 2, cap: 12, heat: false, obs: '#obs', onObs: h => hud.innerHTML = h });
benchUI(bench, $('#ui'), { tubes, reagents: REAG, heat: false });
$('#auto').onclick = () => { const P = [[['hcl', 4], ['qt', 1]], [['naoh', 4], ['pp', 1]], [['hcl', 4], ['zn', 1]], [['hcl', 4], ['cuo', 1]]]; P.forEach((p, i) => { bench.T[i].items = p.map(([id, amt]) => ({ id, amt })); bench.T[i].age = 0; }); bench.redraw(); lab.view(...VIEW.bench); toast('Đã chuẩn bị 4 ống: acid + quỳ tím, base + phenolphthalein, acid + Zn, acid + CuO. Bấm từng ống để xem hiện tượng.'); };
const PH = [0xd62828, 0xe8590c, 0xf08c00, 0xf59f00, 0xe6c200, 0xb5c334, 0x7cb342, 0x43a047, 0x26a69a, 0x1e88e5, 0x3949ab, 0x5e35b1, 0x6a1b9a, 0x4a148c];
const strip = new THREE.Mesh(new THREE.BoxGeometry(.012, .0008, .05), new THREE.MeshStandardMaterial({ color: 0xf2c94a, roughness: .9 })); strip.position.set(.22, .002, .12); scene.add(strip); lab.label(strip, 'Giấy pH', [0, .01, .03]);
$('#ph').onclick = () => { const t = bench.T[bench.sel]; if (!t.items.length) return toast('Ống đang trống'); const p = pHof(t.items); strip.material.color.setHex(PH[clamp(Math.round(p), 1, 14) - 1]); sfx('paper'); toast(`Giấy pH chuyển màu ứng với pH ≈ ${Math.round(p)} (${p < 6.7 ? 'acid' : p > 7.3 ? 'base' : 'trung tính'}).`); lab.view([.2, .16, .3], [.15, .03, .05]); };
$('#gb').onclick = () => lab.view(...VIEW.bench);
// ===== 4. báo cáo =====
const RP = [['Tiêu đề', 'Chính xác, mô tả rõ nội dung báo cáo'], ['Tóm tắt', 'Tổng hợp ngắn mục tiêu, phương pháp, kết quả, kết luận'], ['Giới thiệu', 'Vấn đề nghiên cứu, tầm quan trọng và mục tiêu'], ['Phương pháp', 'Quá trình thí nghiệm hoặc thu thập, xử lí dữ liệu; vật liệu, hoá chất, dụng cụ'], ['Kết quả', 'Dữ liệu trình bày bằng biểu đồ, hình ảnh hoặc bảng'], ['Thảo luận', 'Phân tích, giải thích ý nghĩa kết quả; so sánh với nghiên cứu khác'], ['Kết luận', 'Những phát hiện chính và gợi ý nghiên cứu tiếp'], ['Tài liệu tham khảo', 'Các nguồn thông tin đã sử dụng']];
let od = [], ck = 0;
const sf = () => { od = RP.map((_, i) => i).sort(() => Math.random() - .5); if (od.every((v, i) => v == i)) od.reverse(); ck = 0; $('#cor').textContent = ''; ro(); };
function ro() { $('#od').innerHTML = od.map((k, i) => `<div class="row" style="justify-content:space-between;border:1px solid var(--ln);border-radius:8px;padding:6px 8px;${ck ? (k == i ? 'background:rgba(47,158,68,.12)' : 'background:rgba(224,49,49,.1)') : ''}"><span><b>${i + 1}. ${RP[k][0]}</b><br><span class="sm">${RP[k][1]}</span></span><span><button class="btn g" data-i="${i}" data-d="-1">▲</button><button class="btn g" data-i="${i}" data-d="1">▼</button></span></div>`).join('');
  $('#od').querySelectorAll('button').forEach(b => b.onclick = () => { const i = +b.dataset.i, j = i + +b.dataset.d; if (j < 0 || j >= od.length) return; [od[i], od[j]] = [od[j], od[i]]; ck = 0; ro(); }); }
$('#ckr2').onclick = () => { ck = 1; ro(); const ok = od.every((v, i) => v == i); sfx(ok ? 'chime' : 'error'); $('#cor').innerHTML = ok ? '<span class="ok">Đúng thứ tự!</span>' : `<span class="er">Đúng ${od.filter((v, i) => v == i).length}/8 vị trí.</span>`; };
$('#sf').onclick = sf; sf();
// chuyển góc nhìn theo thẻ
document.querySelectorAll('.tabs button').forEach((b, i) => b.addEventListener('click', () => { if (i == 0) lab.view(...VIEW.tools); if (i == 1) lab.view(...VIEW.shelf); if (i == 2) lab.view(...VIEW.bench); }));
quiz($('#qz'), [
  { q: 'Dụng cụ dùng để tách hai chất lỏng không tan vào nhau là', o: ['phễu lọc', 'phễu chiết', 'bình cầu', 'bát sứ'], a: 1 },
  { q: 'Khi đun cốc thuỷ tinh trên đèn cồn cần đặt', o: ['lưới tản nhiệt', 'giấy lọc', 'bát sứ', 'tấm kính'], a: 0 },
  { q: 'Hoá chất nào cần đựng trong lọ tối màu?', o: ['NaCl', 'AgNO₃', 'HCl loãng', 'CuSO₄'], a: 1 },
  { q: 'Pha loãng H₂SO₄ đặc đúng cách là', o: ['rót nước vào acid', 'rót từ từ acid vào nước và khuấy nhẹ', 'đổ nhanh acid vào nước', 'đun nóng acid'], a: 1 },
  { q: 'Dung dịch làm quỳ tím hoá đỏ có môi trường', o: ['acid', 'base', 'trung tính', 'không xác định'], a: 0 },
  { q: 'Điện kế có vạch 0 ở giữa thang đo để', o: ['đo được điện áp lớn', 'nhận biết được cả hai chiều dòng điện', 'đo điện trở', 'trang trí'], a: 1 },
]);
paint(); ready(); window.dbg = { lab, bench };
</script></body></html>
