<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 12. Đoạn mạch nối tiếp, song song</title>
<link rel="stylesheet" href="../core/ui.css">
<script src="../core/boot.js"></script>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z9HMXNJYEN"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-Z9HMXNJYEN');</script>
</head><body>
<script type="module">
import { createLab, THREE } from '../core/lab3d.js';
import { supply, meter, bulb, resistor, knife, wire, board } from '../core/elec.js';
import { shell, ready, toast, quiz, $, fmt, showPane } from '../core/ui.js';

const stage = shell({
  title: 'Bài 12. Đoạn mạch nối tiếp, song song', sub: 'KHTN 9 – Kết nối tri thức',
  panes: [
    { id: 'p1', title: 'Hướng dẫn', html: `
<h3>Thí nghiệm 1: Đặc điểm của đoạn mạch nối tiếp (Hình 12.2)</h3>
<p><b>Chuẩn bị:</b> nguồn điện một chiều 12 V; ba điện trở R<sub>1</sub> = 6 Ω, R<sub>2</sub> = 10 Ω, R<sub>3</sub> = 16 Ω; hai ampe kế (GHĐ 3 A, ĐCNN 0,01 A); công tắc, dây nối.</p>
<ol><li>Bật nguồn, đóng khoá K. Đọc số chỉ của hai ampe kế A<sub>1</sub>, A<sub>2</sub>, bấm <b>“Ghi số liệu”</b>.</li><li>Lặp lại với các cặp điện trở R<sub>1</sub> và R<sub>3</sub>, R<sub>2</sub> và R<sub>3</sub>.</li></ol>
<div class="row"><b>Cặp điện trở:</b><button class="btn on" data-p="0">R₁ và R₂</button><button class="btn g" data-p="1">R₁ và R₃</button><button class="btn g" data-p="2">R₂ và R₃</button></div>
<h3>Thí nghiệm 2: Đặc điểm của đoạn mạch song song (Hình 12.4)</h3>
<p>Bấm <b>“Mạch song song”</b>. <b>Chuẩn bị:</b> nguồn điện một chiều 6 V; R<sub>1</sub> = 10 Ω, R<sub>2</sub> = 6 Ω; ba ampe kế; công tắc, dây nối.</p>
<ol><li>Đóng khoá K, đọc số chỉ ampe kế A (mạch chính), A<sub>1</sub>, A<sub>2</sub> (mạch nhánh).</li><li>So sánh I với I<sub>1</sub> + I<sub>2</sub>.</li></ol>
<h3>Mở rộng: hai bóng đèn</h3><p>Bấm <b>“Tháo đèn 1”</b> để xem đèn 2 còn sáng hay không trong mỗi cách mắc.</p>` },
    { id: 'p2', title: 'Kết quả', html: `
<h3>Bảng 12.1 – Mạch nối tiếp (U = 12 V)</h3><table class="dt"><thead><tr><th>Điện trở mắc vào mạch</th><th>A₁ (A)</th><th>A₂ (A)</th></tr></thead><tbody id="t1"></tbody></table>
<div class="note sm">Kết luận: cường độ dòng điện tại mọi điểm trong đoạn mạch nối tiếp là như nhau: I = I₁ = I₂. Điện trở tương đương R<sub>tđ</sub> = R₁ + R₂.</div>
<h3>Bảng 12.2 – Mạch song song (U = 6 V)</h3><table class="dt"><thead><tr><th>Ampe kế</th><th>Số chỉ</th></tr></thead><tbody id="t2"></tbody></table>
<div class="note sm">Kết luận: cường độ dòng điện trong mạch chính bằng tổng cường độ dòng điện trong các mạch nhánh: I = I₁ + I₂. Điện trở tương đương: 1/R<sub>tđ</sub> = 1/R₁ + 1/R₂.</div>` },
    { id: 'p3', title: 'Câu hỏi', html: `<div id="qz"></div>` },
  ]
});

const H = { s: [[-.32, .44, .58], [-.32, .03, .02]], p: [[.34, .44, .6], [.34, .03, .02]], b: [[0, .36, .9], [0, .03, .42]] };
const lab = createLab(stage, { cam: H.s[0], target: H.s[1], table: 'wood', tableSize: [1.9, 1.3], minDist: .1 });
const S = { mode: 's', pair: 0 };
const hud = document.createElement('div'); hud.className = 'hud'; stage.appendChild(hud);

/* ===== Nối tiếp ===== */
const RV = [{ n: 'R1', R: 6 }, { n: 'R2', R: 10 }, { n: 'R3', R: 16 }], PAIRS = [[0, 1], [0, 2], [1, 2]];
board(lab, [-.32, 0, .0], .58, .38);
const ps1 = supply(lab, [-.48, .008, -.12], { onToggle: () => solve() });
const k1 = knife(lab, [-.27, .008, -.13], { onToggle: () => solve() });
const A1 = meter(lab, [-.52, .008, .06], { kind: 'A', max: 3, step: .1, label: 'A₁' });
const A2 = meter(lab, [-.27, .008, .06], { kind: 'A', max: 3, step: .1, label: 'A₂' });
const slotA = [-.39, .008, .14], slotB = [-.13, .008, .14];
let Ra = null, Rb = null;
function setPair(i, quiet) {
  S.pair = i; [Ra, Rb].forEach(r => r && lab.remove(r.g));
  const [a, b] = PAIRS[i]; Ra = resistor(lab, slotA, { R: RV[a].R, name: RV[a].n }); Rb = resistor(lab, slotB, { R: RV[b].R, name: RV[b].n });
  document.querySelectorAll('[data-p]').forEach(x => { x.classList.toggle('on', +x.dataset.p == i); x.classList.toggle('g', +x.dataset.p != i); });
  if (!quiet) solve();
}
setPair(0, true);
wire(lab, ps1.term(0), k1.term(0)); wire(lab, k1.term(1), A1.term(0), { sag: .0 }); wire(lab, A1.term(1), Ra.term(0), { color: 0xe67700 });
wire(lab, Ra.term(1), A2.term(0), { color: 0xe67700 }); wire(lab, A2.term(1), Rb.term(0), { color: 0x1b1b1b }); wire(lab, Rb.term(1), ps1.term(1), { color: 0x1b1b1b, sag: .0 });

/* ===== Song song ===== */
board(lab, [.34, 0, .0], .62, .4);
const ps2 = supply(lab, [.14, .008, -.13], { V: 6, onToggle: () => solve() }); ps2.setV(6);
const k2 = knife(lab, [.34, .008, -.14], { onToggle: () => solve() });
const Am = meter(lab, [.12, .008, .07], { kind: 'A', max: 3, step: .1, label: 'A (mạch chính)' });
const P1 = resistor(lab, [.33, .008, .0], { R: 10, name: 'R1' }), P2 = resistor(lab, [.33, .008, .14], { R: 6, name: 'R2' });
const Ap1 = meter(lab, [.53, .008, -.02], { kind: 'A', max: 3, step: .1, label: 'A₁' }), Ap2 = meter(lab, [.53, .008, .13], { kind: 'A', max: 3, step: .1, label: 'A₂' });
lab.label(P1.g, 'M', [-.06, .03, 0], 'read'); lab.label(P2.g, 'N', [.62 - .33 + .0, .03, -.07], 'read');
wire(lab, ps2.term(0), k2.term(0)); wire(lab, k2.term(1), Am.term(0)); wire(lab, Am.term(1), P1.term(0), { color: 0xe67700 }); wire(lab, Am.term(1), P2.term(0), { color: 0xe67700 });
wire(lab, P1.term(1), Ap1.term(0), { color: 0xe67700 }); wire(lab, P2.term(1), Ap2.term(0), { color: 0xe67700 });
wire(lab, Ap1.term(1), ps2.term(1), { color: 0x1b1b1b, sag: -.02 }); wire(lab, Ap2.term(1), Ap1.term(1), { color: 0x1b1b1b });

/* ===== Hai bóng đèn (nối tiếp / song song) ===== */
const bG = board(lab, [0, 0, .42], .9, .2, 0xd6e4ee);
const ps3 = supply(lab, [-.36, .008, .4], { onToggle: () => solve() }); ps3.setV(6);
const bs = [bulb(lab, [-.15, .008, .44], { Unom: 6, Pnom: 3, label: 'Đèn 1 (nối tiếp)' }), bulb(lab, [-.03, .008, .44], { Unom: 6, Pnom: 3, label: 'Đèn 2 (nối tiếp)' }),
  bulb(lab, [.18, .008, .38], { Unom: 6, Pnom: 3, label: 'Đèn 1 (song song)' }), bulb(lab, [.18, .008, .5], { Unom: 6, Pnom: 3, label: 'Đèn 2 (song song)' })];
const ps4 = supply(lab, [.38, .008, .44], { onToggle: () => solve() }); ps4.setV(6);
wire(lab, ps3.term(0), bs[0].term(0)); wire(lab, bs[0].term(1), bs[1].term(0), { color: 0xe67700 }); wire(lab, bs[1].term(1), ps3.term(1), { color: 0x1b1b1b });
wire(lab, ps4.term(0), bs[2].term(1)); wire(lab, ps4.term(0), bs[3].term(1)); wire(lab, ps4.term(1), bs[2].term(0), { color: 0x1b1b1b }); wire(lab, ps4.term(1), bs[3].term(0), { color: 0x1b1b1b });
let removed = false;
const glassOf = b => b.g.children.filter(c => c.geometry && c.geometry.type == 'LatheGeometry')[0];

function solve() {
  const [a, b] = PAIRS[S.pair], on1 = ps1.on && k1.closed, I = on1 ? 12 / (RV[a].R + RV[b].R) : 0;
  A1.set(I); A2.set(I);
  const on2 = ps2.on && k2.closed, i1 = on2 ? 6 / 10 : 0, i2 = on2 ? 6 / 6 : 0;
  Ap1.set(i1); Ap2.set(i2); Am.set(i1 + i2);
  // bóng đèn: R = 12 Ω mỗi đèn
  const Rb_ = 12, Is = ps3.on && !removed ? 6 / (2 * Rb_) : 0;
  bs[0].set(removed ? 0 : Is * Is * Rb_); bs[1].set(Is * Is * Rb_);
  bs[2].set(ps4.on && !removed ? 3 : 0); bs[3].set(ps4.on ? 3 : 0);
  [bs[0], bs[2]].forEach(x => x.g.children.forEach(c => { if (c.position.y > .03) c.visible = !removed; }));
  if (S.mode == 's') hud.innerHTML = on1 ? `Mạch nối tiếp ${RV[a].n} + ${RV[b].n} = ${RV[a].R + RV[b].R} Ω<br>A₁: <b>${fmt(I, 2)} A</b> · A₂: <b>${fmt(I, 2)} A</b>` : (ps1.on ? 'Bấm vào khoá K để đóng mạch.' : 'Bấm nút đỏ trên nguồn điện để bật nguồn.');
  if (S.mode == 'p') hud.innerHTML = on2 ? `Mạch song song (U = 6 V)<br>A: <b>${fmt(i1 + i2, 2)} A</b> · A₁: <b>${fmt(i1, 2)} A</b> · A₂: <b>${fmt(i2, 2)} A</b>` : (ps2.on ? 'Bấm vào khoá K để đóng mạch.' : 'Bấm nút đỏ trên nguồn 6 V để bật nguồn.');
  if (S.mode == 'b') hud.innerHTML = `${ps3.on || ps4.on ? '' : 'Bật cả hai nguồn điện. '}${removed ? 'Đã tháo đèn 1: trong mạch <b>nối tiếp</b> đèn 2 <b>tắt</b>; trong mạch <b>song song</b> đèn 2 <b>vẫn sáng</b>.' : 'Hai đèn nối tiếp sáng yếu hơn hai đèn song song (cùng nguồn 6 V).'}`;
}

/* ===== Ghi số liệu ===== */
const T1 = {}, drawT = () => {
  $('#t1').innerHTML = PAIRS.map(([a, b], i) => `<tr><td>${RV[a].n} và ${RV[b].n}</td><td>${T1[i] != null ? fmt(T1[i], 2) : '?'}</td><td>${T1[i] != null ? fmt(T1[i], 2) : '?'}</td></tr>`).join('');
  $('#t2').innerHTML = [['A', 'I', T2.I], ['A₁', 'I₁', T2.i1], ['A₂', 'I₂', T2.i2]].map(([a, b, v]) => `<tr><td>${a}</td><td>${b} = ${v != null ? fmt(v, 2) + ' A' : '?'}</td></tr>`).join('') + (T2.I != null ? `<tr><td colspan="2">I₁ + I₂ = ${fmt(T2.i1 + T2.i2, 2)} A = I</td></tr>` : '');
};
const T2 = {};
const tb = document.createElement('div'); tb.className = 'tb'; stage.appendChild(tb);
tb.innerHTML = `<button class="btn p" id="bRec">Ghi số liệu</button><button class="btn" id="bS">Mạch nối tiếp</button><button class="btn" id="bP">Mạch song song</button><button class="btn" id="bB">Hai bóng đèn</button><button class="btn" id="bRm">Tháo đèn 1</button><button class="btn" id="bLbl">Tên dụng cụ</button>`;
function setMode(m) { S.mode = m; ['bS', 'bP', 'bB'].forEach(id => $('#' + id).classList.toggle('on', id == { s: 'bS', p: 'bP', b: 'bB' }[m])); $('#bRm').style.display = m == 'b' ? '' : 'none'; $('#bRec').style.display = m == 'b' ? 'none' : ''; lab.view(...H[m]); solve(); }
$('#bS').onclick = () => setMode('s'); $('#bP').onclick = () => setMode('p'); $('#bB').onclick = () => setMode('b');
$('#bRm').onclick = () => { removed = !removed; $('#bRm').textContent = removed ? 'Lắp lại đèn 1' : 'Tháo đèn 1'; solve(); };
$('#bRec').onclick = () => {
  if (S.mode == 's') { if (!(ps1.on && k1.closed)) return toast('Hãy bật nguồn và đóng khoá K.'); const [a, b] = PAIRS[S.pair]; T1[S.pair] = Math.round(12 / (RV[a].R + RV[b].R) * 100) / 100; }
  else { if (!(ps2.on && k2.closed)) return toast('Hãy bật nguồn và đóng khoá K.'); T2.I = 1.6; T2.i1 = .6; T2.i2 = 1; }
  drawT(); showPane(1); toast('Đã ghi số liệu vào bảng.');
};
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (S.mode != 's') setMode('s'); setPair(+b.dataset.p); toast('Đã thay cặp điện trở'); });
let lbl = true; $('#bLbl').onclick = () => { lbl = !lbl; lab.showLabels(lbl); $('#bLbl').classList.toggle('on', !lbl); };
void glassOf;

quiz($('#qz'), [
  { q: 'Trong đoạn mạch mắc nối tiếp, cường độ dòng điện', o: ['ở mọi điểm như nhau', 'qua điện trở lớn thì lớn hơn', 'qua điện trở nhỏ thì lớn hơn', 'bằng tổng các dòng điện thành phần'], a: 0 },
  { q: 'R₁ = 2 Ω và R₂ = 3 Ω mắc nối tiếp. Điện trở tương đương bằng bao nhiêu Ω?', n: 5, u: 'Ω' },
  { q: 'Với R₁ = 2 Ω, R₂ = 3 Ω nối tiếp, dòng điện qua R₁ là 1 A. Hiệu điện thế giữa hai đầu đoạn mạch là bao nhiêu vôn?', n: 5, u: 'V', e: 'U = I·R_tđ = 1·5 = 5 V.' },
  { q: 'Trong đoạn mạch song song, cường độ dòng điện trong mạch chính', o: ['bằng cường độ trong mỗi nhánh', 'bằng tổng cường độ dòng điện trong các mạch nhánh', 'nhỏ hơn cường độ mỗi nhánh', 'bằng hiệu cường độ hai nhánh'], a: 1 },
  { q: 'Hai điện trở 20 Ω và 40 Ω mắc song song. Điện trở tương đương bằng bao nhiêu Ω? (làm tròn 2 chữ số thập phân)', n: 13.33, u: 'Ω', tol: .01, e: 'R = 20·40/(20+40) ≈ 13,33 Ω.' },
  { q: 'Mắc song song 20 Ω và 40 Ω vào hiệu điện thế 24 V. Cường độ dòng điện mạch chính là bao nhiêu ampe?', n: 1.8, u: 'A', e: 'I = 24/20 + 24/40 = 1,2 + 0,6 = 1,8 A.' },
  { q: 'Muốn khi một đèn hỏng thì đèn kia vẫn sáng, ta phải mắc hai đèn', o: ['nối tiếp', 'song song', 'cách nào cũng được', 'không thể'], a: 1 },
]);
drawT(); setMode('s'); ready();
window.dbg = { S, lab, ps1, k1, ps2, k2, solve };
</script></body></html>
