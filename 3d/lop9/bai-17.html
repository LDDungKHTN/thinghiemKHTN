  rotor.rotation.z -= om * dt; const bp = Math.floor(-rotor.rotation.z / 2.094); if (bp != lastBlade) { lastBlade = bp; if (om > 2 && near(X.w) > .2) sfx('swish', { vol: Math.min(1, om / 15) * near(X.w) }); }
  lcd2.set(fmt(Pw, 0) + ' kW');
  SK.forEach((p, i) => { p.x += dt * v * .03; if (p.x > 1) p.x = 0; const m = new THREE.Matrix4().makeTranslation(X.w - .35 + p.x * .7, p.y, p.z + .1); streaks.setMatrixAt(i, v > .5 ? m : new THREE.Matrix4().makeScale(0, 0, 0)); }); streaks.instanceMatrix.needsUpdate = true;
  $('#e3').innerHTML = `Tốc độ gió ${fmt(v, 1)} m/s → công suất <b>${fmt(Pw, 0)} kW</b>. ${v < 3 ? 'Gió quá yếu, tuabin chưa phát điện.' : v > 25 ? 'Gió quá mạnh (bão): tuabin dừng để bảo vệ.' : v >= 12 ? 'Đạt công suất định mức.' : 'Gió càng mạnh, công suất càng lớn.'}`;
  // sóng
  const k = 2 * Math.PI / .12, w = 2 * Math.PI / (S.wt / 4), A = S.wh * .006, p = wg.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, A * Math.sin(k * p.getX(i) - w * t)); p.needsUpdate = true; wg.computeVertexNormals();
  const by = .045 + A * Math.sin(k * .03 - w * t); buoy.position.set(.03, by + .004, 0); rod.scale.y = .16 - by; rod.position.set(.03, by + (.16 - by) / 2, -.02); rod.rotation.x = .12;
  const cr = Math.sin(k * .03 - w * t) > .95; if (cr && t - lastCrest > .4) { lastCrest = t; if (near(X.v) > .2) sfx('splash', { vol: .25 * near(X.v) * S.wh }); }
  const Pv = .5 * S.wh * S.wh * S.wt; lcd3.set(fmt(Pv, 1) + ' kW');
  $('#e4').innerHTML = `Công suất mỗi mét bờ sóng ≈ <b>${fmt(Pv, 1)} kW</b> (minh hoạ định tính): sóng càng cao, chu kì càng dài thì năng lượng càng lớn.`;
  // thuỷ điện
  const hW = .03 + S.hh / 150 * .12; resv.scale.y = hW; resv.position.y = .02 + hW / 2; const Ph = 9.8 * S.qq * S.hh * .9 / 1000;
  turb.rotation.y += dt * S.qq / 40; lcd4.set(fmt(Ph, 0) + ' MW');
  PDr.forEach((d, i) => { d.t += dt * (.5 + S.qq / 300); if (d.t > 1) d.t = 0; const m = new THREE.Matrix4().makeTranslation(.08 + d.t * .08, .03, d.z); drops.setMatrixAt(i, S.qq > 0 ? m : new THREE.Matrix4().makeScale(0, 0, 0)); }); drops.instanceMatrix.needsUpdate = true;
  $('#e5').innerHTML = `P ≈ 9,8 · Q · h · 90% = <b>${fmt(Ph, 0)} MW</b>. Cột nước càng cao, lưu lượng càng lớn thì công suất càng lớn.`;
  // đèn
  L1.set(S.lamps ? 60 : 0); L2.set(S.lamps ? 9 : 0); lcd5.set(S.lamps ? '60 W' : '0 W'); lcd6.set(S.lamps ? '9 W' : '0 W');
  // âm thanh nền theo khung đang xem
  level('wind', near(X.w) * Math.min(1, v / 18), .7 + v * .03); level('stream', near(X.h) * Math.min(1, S.qq / 300)); level('motor', near(X.h) * Math.min(.8, S.qq / 400), .6 + S.qq / 800); level('roll', near(X.v) * .3 * S.wh);
  hud.innerHTML = 'Chọn các thẻ bên phải để đến từng mô hình.';
});
