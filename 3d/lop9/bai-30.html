<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 30. Tinh bột và cellulose</title>
<link rel="stylesheet" href="../core/ui.css">
<script src="../core/boot.js"></script>
</head><body>
<script type="module">
import { createLab, THREE, clamp } from '../core/lab3d.js';
import { chemBench, benchUI } from '../core/chemlab.js';
import { shell, ready, toast, quiz, $ } from '../core/ui.js';

const stage = shell({
  title: 'Bài 30. Tinh bột và cellulose', sub: 'KHTN 9 – Kết nối tri thức',
  panes: [
    { id: 'p1', title: 'Thí nghiệm', html: `
<h3>1. Phản ứng màu của hồ tinh bột với iodine</h3><p>Thêm 5 mL hồ tinh bột vào ống nghiệm, nhỏ vài giọt dung dịch iodine.</p>
<h3>2. Thuỷ phân tinh bột</h3><ol><li>Lấy hai ống (1) và (2), mỗi ống 3 mL hồ tinh bột. Thêm 1 mL dd HCl 2 M vào ống (1).</li><li>Đặt cả hai ống vào cốc nước sôi, đun khoảng 10 phút (bấm “Đun nóng” lần lượt từng ống).</li><li>Để nguội, nhỏ vài giọt dd iodine vào mỗi ống.</li></ol>
<div id="ui"></div><div id="obs" class="note"></div>
<div class="row"><button class="btn g" id="auto">Chuẩn bị nhanh TN2</button></div>` },
    { id: 'p2', title: 'Kết luận', html: `<ul><li>Hồ tinh bột phản ứng với iodine tạo hợp chất <b>màu xanh tím</b> – dùng để nhận biết tinh bột (cellulose không có phản ứng này).</li><li>Ống (1) có HCl, đun nóng: tinh bột bị <b>thuỷ phân</b> thành glucose nên không còn màu xanh tím khi nhỏ iodine. Ống (2) không có acid: tinh bột không bị thuỷ phân, vẫn có màu xanh tím.</li><li>(C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆ (acid/enzyme, t°)</li></ul>` },
    { id: 'p3', title: 'Câu hỏi', html: `<div id="qz"></div>` },
  ]
});
const lab = createLab(stage, { cam: [.08, .28, .55], target: [.1, .08, -.02], table: 'bench', tableSize: [1.5, .8], minDist: .06 });
const hud = document.createElement('div'); hud.className = 'hud'; stage.appendChild(hud);
const REAG = [{ id: 'tb', n: 'Hồ tinh bột', c: 0xf4f2ea, k: 'liq' }, { id: 'hcl', n: 'HCl 2 M', c: 0xeef6f8, k: 'liq' }, { id: 'i2', n: 'Dd iodine', c: 0xb5651d, k: 'drop', tag: '#fff0dc' }];
const has = (it, id) => it.find(x => x.id == id), mix = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), clamp(t, 0, 1)).getHex();
const hyd = {};
function react(it, heat, age, i) {
  const s = { notes: [], eq: [] }; if (!it.length) return s;
  const T = has(it, 'tb'), H = has(it, 'hcl'), I = has(it, 'i2');
  s.color = 0xeef3f4; s.op = .35; if (T) { s.cloud = .12; s.cloudC = 0xffffff; s.op = .45; s.color = 0xf1efe6; }
  if (T && heat) hyd[i] = Math.min(1, (hyd[i] || 0) + (H ? .04 : 0));
  const h = hyd[i] || 0;
  if (heat) s.notes.push(`Đang đun trong nước sôi${H ? ' (có HCl)' : ' (không có acid)'}…`);
  if (h >= 1 && !I) s.notes.push('Đã đun đủ thời gian. Để nguội rồi nhỏ dung dịch iodine.');
  if (I) {
    if (T && h < 1 && !heat) { s.color = mix(0x6a64b0, 0x1c1660, 1 - h); s.op = .95; s.cloud = 0; s.notes.push('Dung dịch chuyển sang <b>màu xanh tím</b>: tinh bột phản ứng với iodine.'); }
    else if (T && h >= 1) { s.color = 0xe8c070; s.op = .45; s.cloud = 0; s.notes.push('Dung dịch có màu vàng nhạt của iodine, <b>không có màu xanh tím</b>: tinh bột đã bị thuỷ phân hết.'); s.eq.push('(C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆'); }
    else if (T && heat) { s.color = 0xe0b060; s.op = .5; s.notes.push('Khi đang nóng màu xanh tím không bền; để nguội rồi quan sát.'); }
    else { s.color = 0xd8a050; s.op = .5; s.notes.push('Dung dịch iodine màu vàng nâu.'); }
  } else if (T && !heat && !(h >= 1)) s.notes.push('Hồ tinh bột: chất lỏng hơi đục.');
  return s;
}
const tubes = ['Ống 1', 'Ống 2', 'Ống 3'];
const bench = chemBench(lab, { tubes, reagents: REAG, react, vol: 3, cap: 15, bath: true, obs: '#obs', onObs: h => hud.innerHTML = h });
benchUI(bench, $('#ui'), { tubes, reagents: REAG });
$('#auto').onclick = () => { bench.T[0].items = [{ id: 'tb', amt: 3 }, { id: 'hcl', amt: 1 }]; bench.T[1].items = [{ id: 'tb', amt: 3 }]; bench.T.forEach(t => t.age = 0); bench.redraw(); bench.select(0); toast('Ống 1: hồ tinh bột + HCl; ống 2: hồ tinh bột. Bấm “Đun nóng” cho từng ống.'); };
quiz($('#qz'), [
  { q: 'Thuốc thử để nhận biết hồ tinh bột là', o: ['phenolphthalein', 'dung dịch iodine', 'quỳ tím', 'dd AgNO₃'], a: 1 },
  { q: 'Hồ tinh bột tác dụng với iodine cho màu', o: ['đỏ', 'xanh tím', 'vàng', 'hồng'], a: 1 },
  { q: 'Sản phẩm thuỷ phân hoàn toàn tinh bột là', o: ['saccharose', 'glucose', 'ethylic alcohol', 'fructose và glucose'], a: 1 },
  { q: 'Người có enzyme thuỷ phân', o: ['cả tinh bột và cellulose', 'tinh bột nhưng không có enzyme thuỷ phân cellulose', 'chỉ cellulose', 'không thuỷ phân được'], a: 1 },
]);
ready(); window.dbg = { lab, bench };
</script></body></html>
