<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 18. Tính chất chung của kim loại</title>
<link rel="stylesheet" href="../core/ui.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { createLab, THREE, MAT, roundBox, canvasTex, clamp } from '../core/lab3d.js';
import { vessel, burner } from '../core/chem.js';
import { chemBench, benchUI } from '../core/chemlab.js';
import { shell, ready, toast, quiz, $, fmt } from '../core/ui.js';

const stage = shell({
  title: 'Bài 18. Tính chất chung của kim loại', sub: 'KHTN 9 – Kết nối tri thức',
  panes: [
    { id: 'p1', title: 'Thí nghiệm', html: `
<h3>1. Kim loại tác dụng với dung dịch acid, dung dịch muối</h3>
<p>Chọn ống nghiệm, bấm lọ hoá chất (trên bàn hoặc nút dưới đây) để cho vào ống. Quan sát hiện tượng.</p>
<div id="ui"></div>
<div id="obs" class="note"></div>
<p class="sm">Gợi ý: cho đinh sắt, kẽm, đồng, magnesium vào dd HCl; cho đinh sắt vào dd CuSO₄; cho đồng vào dd HCl.</p>
<h3>2. Natri tác dụng với nước</h3><p>Bấm <b>“Natri + nước”</b> trên thanh công cụ.</p>
<h3>3. Kim loại tác dụng với phi kim</h3><p>Bấm <b>“Đốt trong bình khí”</b>: chọn khí oxygen hoặc chlorine và kim loại.</p>
<div class="row"><b>Khí:</b><button class="btn on" data-gas="o2">Oxygen</button><button class="btn g" data-gas="cl2">Chlorine</button> <b>Kim loại:</b><button class="btn on" data-met="fe">Dây sắt</button><button class="btn g" data-met="na">Natri</button></div>
<div class="warn sm">Thí nghiệm với natri và chlorine chỉ do giáo viên biểu diễn: natri phản ứng mãnh liệt, chlorine rất độc.</div>` },
    { id: 'p2', title: 'Kết luận', html: `<ul>
<li>Hầu hết kim loại tác dụng với oxygen tạo oxide (3Fe + 2O₂ → Fe₃O₄), với phi kim khác tạo muối (2Na + Cl₂ → 2NaCl; 2Fe + 3Cl₂ → 2FeCl₃).</li>
<li>Kim loại mạnh như K, Na, Ca… tác dụng với nước ở nhiệt độ thường tạo hydroxide và khí hydrogen: 2Na + 2H₂O → 2NaOH + H₂.</li>
<li>Một số kim loại tác dụng với dung dịch HCl tạo muối và khí hydrogen: Fe + 2HCl → FeCl₂ + H₂. Cu, Ag, Au… không tác dụng.</li>
<li>Kim loại mạnh hơn đẩy kim loại yếu hơn ra khỏi dung dịch muối: Fe + CuSO₄ → FeSO₄ + Cu.</li></ul>` },
    { id: 'p3', title: 'Câu hỏi', html: `<div id="qz"></div>` },
  ]
});
const H = { bench: [[0, .32, .55], [0, .08, -.02]], na: [[-.62, .25, .32], [-.62, .03, 0]], burn: [[.68, .28, .42], [.68, .12, 0]] };
const lab = createLab(stage, { cam: H.bench[0], target: H.bench[1], table: 'bench', tableSize: [1.9, .8], minDist: .06 });
const { scene } = lab;
const hud = document.createElement('div'); hud.className = 'hud'; stage.appendChild(hud);
const S = { mode: 'bench', na: null, gas: 'o2', met: 'fe', burn: null };

/* ===== Bàn ống nghiệm ===== */
const REAG = [
  { id: 'hcl', n: 'dd HCl', c: 0xeef6f8, k: 'liq' }, { id: 'cuso4', n: 'dd CuSO₄', c: 0x2f8fe0, k: 'liq', tag: '#e3f1ff' }, { id: 'h2o', n: 'Nước cất', c: 0xdff1fa, k: 'liq' },
  { id: 'fe', n: 'Đinh sắt', c: 0x8f969c, k: 'sol', solid: { kind: 'nail', c: 0x8f969c, metal: true }, max: 1 },
  { id: 'zn', n: 'Kẽm viên', c: 0xb8bcc4, k: 'sol', solid: { kind: 'chunk', c: 0xb8bcc4, metal: true } },
  { id: 'mg', n: 'Mg (băng)', c: 0xcfd2d6, k: 'sol', solid: { kind: 'strip', c: 0xcfd2d6, metal: true }, max: 1 },
  { id: 'cu', n: 'Dây đồng', c: 0xc06a3a, k: 'sol', solid: { kind: 'wire', c: 0xc06a3a, metal: true }, max: 1 }];
const has = (it, id) => it.find(x => x.id == id);
const mix = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), clamp(t, 0, 1)).getHex();
function react(it, heat, age) {
  const s = { notes: [], eq: [] }; if (!it.length) return s;
  const hcl = has(it, 'hcl'), cu2 = has(it, 'cuso4'), w = has(it, 'h2o'), liq = (hcl ? hcl.amt : 0) + (cu2 ? cu2.amt : 0) + (w ? w.amt : 0);
  const met = ['fe', 'zn', 'mg', 'cu'].find(m => has(it, m)), mr = met && REAG.find(r => r.id == met);
  s.color = 0xeef6f8; s.op = .35;
  if (cu2) { const f = cu2.amt / liq; s.color = mix(0xeef6f8, 0x1f74d6, f); s.op = .5 + .25 * f; }
  if (met) s.solid = { ...mr.solid, amt: has(it, met).amt };
  if (!met) { if (cu2) s.notes.push('Dung dịch CuSO₄ có màu xanh lam.'); else s.notes.push('Dung dịch không màu.'); return s; }
  if (!liq) { s.notes.push(`${mr.n} trong ống nghiệm khô: chưa có hiện tượng.`); return s; }
  const k = clamp(age / 25, 0, 1);
  if (hcl && met != 'cu') {
    const rate = { mg: 1, zn: .55, fe: .32 }[met] * (heat ? 1.4 : 1), left = met == 'mg' ? 1 - clamp(age / 12, 0, 1) : 1;
    s.bubbles = rate * (met == 'mg' ? left : 1);
    if (met == 'mg') { s.solid.amt = Math.max(0, left); s.gas = { c: 0xffffff, amt: .15 * left }; }
    if (met == 'fe') s.color = mix(s.color, 0xd8efd0, k * .8);
    s.notes.push(`Có <b>bọt khí không màu</b> thoát ra ${met == 'mg' ? 'rất mạnh, mảnh magnesium tan dần, ống nghiệm nóng lên' : met == 'zn' ? 'nhiều trên bề mặt viên kẽm' : 'trên bề mặt đinh sắt; dung dịch chuyển dần sang màu lục nhạt'}.`, 'Khí thoát ra là hydrogen (H₂).');
    s.eq.push({ fe: 'Fe + 2HCl → FeCl₂ + H₂↑', zn: 'Zn + 2HCl → ZnCl₂ + H₂↑', mg: 'Mg + 2HCl → MgCl₂ + H₂↑' }[met]);
  }
  if (hcl && met == 'cu') s.notes.push('Dây đồng <b>không có hiện tượng</b>: đồng không tác dụng với dung dịch HCl.');
  if (cu2 && met != 'cu') {
    const f = cu2.amt / liq;
    s.color = mix(mix(0xeef6f8, 0x1f74d6, f), met == 'fe' ? 0xcde9c8 : 0xeef6f8, k); s.op = .5 + .25 * f - .3 * k;
    s.solid.c = mix(mr.solid.c, 0xb4532a, clamp(age / 8, 0, 1)); s.solid.metal = age < 6;
    s.notes.push(`Có <b>lớp chất rắn màu đỏ</b> (đồng) bám trên bề mặt ${mr.n.toLowerCase()}; màu xanh lam của dung dịch <b>nhạt dần</b>.`);
    s.eq.push({ fe: 'Fe + CuSO₄ → FeSO₄ + Cu', zn: 'Zn + CuSO₄ → ZnSO₄ + Cu', mg: 'Mg + CuSO₄ → MgSO₄ + Cu' }[met]);
  }
  if (cu2 && met == 'cu') s.notes.push('Đồng không tác dụng với dung dịch CuSO₄.');
  if (w && !hcl && !cu2) s.notes.push(met == 'mg' && heat ? 'Đun nóng: có ít bọt khí thoát ra (Mg tác dụng chậm với nước nóng).' : `${mr.n} không tác dụng với nước ở nhiệt độ thường.`), (met == 'mg' && heat) && (s.bubbles = .1);
  return s;
}
const tubes = ['Ống 1', 'Ống 2', 'Ống 3', 'Ống 4'];
const bench = chemBench(lab, { tubes, reagents: REAG, react, vol: 4, cap: 16, obs: '#obs', onObs: h => { if (S.mode == 'bench') hud.innerHTML = h; } });
benchUI(bench, $('#ui'), { tubes, reagents: REAG });

/* ===== Natri + nước ===== */
const dish = vessel(lab, { kind: 'beaker', R: .07, H: .035 }); dish.g.position.set(-.62, 0, 0); scene.add(dish.g); dish.set({ level: .8, color: 0xe8f4fa, op: .3 });
lab.label(dish.g, 'Cốc thuỷ tinh: nước + vài giọt phenolphthalein', [0, .07, 0]);
const naM = new THREE.MeshStandardMaterial({ color: 0xd6d9dc, metalness: .9, roughness: .25, emissive: 0xffa020, emissiveIntensity: 0 });
const na = new THREE.Mesh(new THREE.SphereGeometry(.006, 20, 16), naM); na.visible = false; scene.add(na);
const naGlow = new THREE.PointLight(0xffaa33, 0, .3, 2); scene.add(naGlow);
const knife = new THREE.Mesh(new THREE.BoxGeometry(.01, .004, .01), new THREE.MeshStandardMaterial({ color: 0xd6d9dc, metalness: .8, roughness: .3 })); knife.position.set(-.5, .003, .06); scene.add(knife);
lab.label(knife, 'Mẩu natri', [0, .015, 0]);
const pink = { k: 0 };

/* ===== Bình khí + đốt kim loại ===== */
const fl = vessel(lab, { kind: 'flask', R: .055, H: .2, neck: .016 }); fl.g.position.set(.68, 0, 0); scene.add(fl.g);
const spoon = new THREE.Group(); scene.add(spoon);
const sRod = new THREE.Mesh(new THREE.CylinderGeometry(.0015, .0015, .2, 8), MAT.metal(0x8a8f95, .4)); sRod.position.y = .1; spoon.add(sRod);
const coilPts = []; for (let i = 0; i <= 120; i++) { const a = i / 120 * Math.PI * 10; coilPts.push(new THREE.Vector3(Math.cos(a) * .006, -i / 120 * .04, Math.sin(a) * .006)); }
const feM = new THREE.MeshStandardMaterial({ color: 0x777c82, metalness: .8, roughness: .4, emissive: 0xff6a00, emissiveIntensity: 0 });
const feCoil = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(coilPts), 120, .0008, 6), feM); spoon.add(feCoil);
const cup = new THREE.Mesh(new THREE.SphereGeometry(.008, 16, 8, 0, 6.3, Math.PI / 2, Math.PI / 2), MAT.metal(0x8a8f95, .4)); cup.position.y = -.002; spoon.add(cup);
const naBall = new THREE.Mesh(new THREE.SphereGeometry(.004, 12, 10), naM.clone()); naBall.position.y = .0; spoon.add(naBall);
const fireL = new THREE.PointLight(0xffe0a0, 0, .6, 2); spoon.add(fireL);
const NS = 120, spk = new Float32Array(NS * 3), spkV = []; const spG = new THREE.BufferGeometry(); spG.setAttribute('position', new THREE.BufferAttribute(spk, 3));
const sparks = new THREE.Points(spG, new THREE.PointsMaterial({ color: 0xffd36a, size: .004, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })); scene.add(sparks); sparks.visible = false;
for (let i = 0; i < NS; i++) spkV.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), life: 0 });
const lamp = burner(lab, [.55, 0, .08]); lab.label(lamp.g, 'Đèn cồn', [0, .12, 0]);
lab.label(fl.g, 'Bình khí', [0, .23, 0]);
const smoke = new THREE.Mesh(new THREE.SphereGeometry(.05, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })); smoke.position.set(.68, .055, 0); smoke.renderOrder = 3; scene.add(smoke);
function setGas() { fl.set({ level: 0, gas: null }); fl.g.children[0].material.color.set(S.gas == 'cl2' ? 0xe6f2a8 : 0xf2fbff); fl.g.children[0].material.opacity = S.gas == 'cl2' ? .35 : .2; }
function resetBurn() { S.burn = null; spoon.position.set(.55, .18, .08); feCoil.visible = S.met == 'fe'; naBall.visible = cup.visible = S.met == 'na'; feM.emissiveIntensity = 0; naBall.material.emissiveIntensity = 0; fireL.intensity = 0; smoke.material.opacity = 0; sparks.visible = false; lamp.set(false); setGas(); }

lab.onTick((dt, t) => {
  // natri chạy trên mặt nước
  if (S.na) {
    const n = S.na; n.t += dt; const lv = .035 * .8 * .85 + .0016;
    if (n.t < .6) { na.position.lerpVectors(n.p0, new THREE.Vector3(-.62, lv + .004, 0), n.t / .6); }
    else { n.a += (Math.sin(t * 7) * 3 + Math.sin(t * 3.3) * 2) * dt; n.x = clamp(n.x + Math.cos(n.a) * dt * .08, -.055, .055); n.z = clamp(n.z + Math.sin(n.a) * dt * .08, -.055, .055); if (Math.hypot(n.x, n.z) > .055) n.a += Math.PI; na.position.set(-.62 + n.x, lv + .003, n.z);
      n.r = Math.max(0, 1 - (n.t - .6) / 9); na.scale.setScalar(.3 + .7 * n.r); naM.emissiveIntensity = n.r > .05 && n.t > 2.5 && n.t < 6 ? 1.5 : .2; naGlow.position.copy(na.position); naGlow.intensity = naM.emissiveIntensity > 1 ? .2 : 0;
      pink.k = Math.min(1, pink.k + dt * .12); dish.set({ color: mix(0xe8f4fa, 0xe64aa8, pink.k), op: .3 + .25 * pink.k, bubbles: n.r > .05 ? .15 : 0, gas: n.r > .05 ? { c: 0xffffff, amt: .2 } : null });
      if (n.r <= 0) { na.visible = false; S.na = null; naGlow.intensity = 0; } }
  }
  // đốt kim loại
  if (S.burn) {
    const b = S.burn; b.t += dt;
    if (b.t < 2.5) { spoon.position.set(.55, .18, .08); feM.emissiveIntensity = b.t / 2.5 * 1.5; naBall.material.emissiveIntensity = b.t / 2.5; }
    else if (b.t < 3.4) { const k = (b.t - 2.5) / .9; spoon.position.set(.55 + .13 * k, .18 + .02 * Math.sin(k * Math.PI), .08 - .08 * k); }
    else {
      spoon.position.set(.68, .2, 0); const life = clamp((b.t - 3.4) / 10, 0, 1), on = life < 1;
      fireL.intensity = on ? (S.met == 'na' ? .6 : .9) * (1 - life * .5) : 0; fireL.color.set(S.met == 'na' && S.gas == 'cl2' ? 0xffd04a : 0xfff0c0);
      feM.emissiveIntensity = on ? 3 : 0; naBall.material.emissiveIntensity = on ? 3 : 0; sparks.visible = on && S.met == 'fe';
      smoke.material.color.set(S.gas == 'cl2' ? (S.met == 'fe' ? 0x8a3a12 : 0xf2f2ee) : (S.met == 'fe' ? 0x7a3b1c : 0xf2f2ee)); smoke.material.opacity = Math.min(.55, life * .8);
      if (sparks.visible) { const o = feCoil.getWorldPosition(new THREE.Vector3()); spkV.forEach((s, i) => { if (s.life <= 0) { s.p.copy(o).add(new THREE.Vector3(0, -.02 * Math.random(), 0)); s.v.set((Math.random() - .5) * .3, Math.random() * .2 - .05, (Math.random() - .5) * .3); s.life = .2 + Math.random() * .4; } s.life -= dt; s.v.y -= .6 * dt; s.p.addScaledVector(s.v, dt); spk.set([s.p.x, s.p.y, s.p.z], i * 3); }); spG.attributes.position.needsUpdate = true; }
      if (S.met == 'fe') feCoil.scale.y = 1 - life * .6; else naBall.scale.setScalar(1 - life * .8);
      if (!b.done && life >= 1) { b.done = true; toast('Phản ứng kết thúc'); }
    }
    const txt = b.t < 2.5 ? (S.met == 'fe' ? 'Đốt nóng đỏ đầu dây sắt trên ngọn lửa đèn cồn…' : 'Đun nóng chảy mẩu natri…') : b.t < 3.4 ? 'Đưa nhanh vào bình khí…' :
      ({ 'fe-o2': 'Sắt <b>cháy sáng chói</b>, có nhiều tia lửa bắn ra, tạo khói màu nâu đỏ. 3Fe + 2O₂ → Fe₃O₄', 'na-o2': 'Natri cháy với ngọn lửa màu vàng, tạo khói trắng. 4Na + O₂ → 2Na₂O', 'na-cl2': 'Natri <b>cháy sáng</b> trong khí chlorine tạo khói trắng – tinh thể muối ăn NaCl. 2Na + Cl₂ → 2NaCl', 'fe-cl2': 'Sắt cháy trong khí chlorine tạo <b>khói màu nâu đỏ</b> – muối iron(III) chloride. 2Fe + 3Cl₂ → 2FeCl₃' })[S.met + '-' + S.gas];
    if (S.mode == 'burn') hud.innerHTML = txt;
  }
});
const tb = document.createElement('div'); tb.className = 'tb'; stage.appendChild(tb);
tb.innerHTML = `<button class="btn on" data-m="bench">Ống nghiệm</button><button class="btn" data-m="na">Natri + nước</button><button class="btn" data-m="burn">Đốt trong bình khí</button><button class="btn p" id="bAct">Thả natri</button><button class="btn" id="bLbl">Tên</button>`;
function setMode(m) { S.mode = m; tb.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m == m)); lab.view(...H[m]); $('#bAct').style.display = m == 'bench' ? 'none' : ''; $('#bAct').textContent = m == 'na' ? 'Thả natri vào nước' : 'Đốt và đưa vào bình'; hud.innerHTML = m == 'na' ? 'Bấm “Thả natri vào nước”.' : m == 'burn' ? `Bình chứa khí ${S.gas == 'o2' ? 'oxygen' : 'chlorine (màu vàng lục)'}. Bấm “Đốt và đưa vào bình”.` : $('#obs').innerHTML; }
tb.querySelectorAll('[data-m]').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('#bAct').onclick = () => {
  if (S.mode == 'na') { pink.k = 0; dish.set({ color: 0xe8f4fa, op: .3 }); na.visible = true; na.scale.setScalar(1); S.na = { t: 0, p0: new THREE.Vector3(-.5, .02, .06), a: 0, x: 0, z: 0, r: 1 }; hud.innerHTML = 'Mẩu natri <b>nóng chảy thành giọt tròn, chạy trên mặt nước</b>, có khí thoát ra, có thể bốc cháy; dung dịch chuyển sang <b>màu hồng</b> (có NaOH).<br>2Na + 2H₂O → 2NaOH + H₂↑'; }
  else { resetBurn(); lamp.set(true); S.burn = { t: 0 }; }
};
document.querySelectorAll('[data-gas]').forEach(b => b.onclick = () => { S.gas = b.dataset.gas; document.querySelectorAll('[data-gas]').forEach(x => { x.classList.toggle('on', x == b); x.classList.toggle('g', x != b); }); resetBurn(); setMode('burn'); });
document.querySelectorAll('[data-met]').forEach(b => b.onclick = () => { S.met = b.dataset.met; document.querySelectorAll('[data-met]').forEach(x => { x.classList.toggle('on', x == b); x.classList.toggle('g', x != b); }); resetBurn(); setMode('burn'); });
let lbl = true; $('#bLbl').onclick = () => { lbl = !lbl; lab.showLabels(lbl); $('#bLbl').classList.toggle('on', !lbl); };

quiz($('#qz'), [
  { q: 'Kim loại nào sau đây dẫn điện tốt nhất?', o: ['Vàng', 'Bạc', 'Nhôm', 'Sắt'], a: 1 },
  { q: 'Cho đinh sắt vào dung dịch CuSO₄, hiện tượng quan sát được là', o: ['Có khí thoát ra', 'Có lớp đồng màu đỏ bám trên đinh sắt, màu xanh của dung dịch nhạt dần', 'Không có hiện tượng', 'Dung dịch chuyển màu hồng'], a: 1 },
  { q: 'Kim loại nào không tác dụng với dung dịch HCl?', o: ['Fe', 'Zn', 'Mg', 'Cu'], a: 3 },
  { q: 'Cho natri vào nước có pha phenolphthalein, dung dịch chuyển sang màu hồng vì', o: ['tạo ra NaCl', 'tạo ra dung dịch base NaOH', 'natri có màu hồng', 'tạo ra acid'], a: 1 },
  { q: 'Cần bao nhiêu gam kẽm để điều chế 250 mL khí H₂ (đkc, 24,79 L/mol) theo Zn + 2HCl → ZnCl₂ + H₂? (làm tròn 2 chữ số thập phân)', n: .66, u: 'g', tol: .02, e: 'n(H₂) = 0,25/24,79 ≈ 0,01 mol → m(Zn) = 0,01·65 ≈ 0,66 g.' },
  { q: 'Vì sao đồ trang sức bằng vàng để lâu vẫn sáng đẹp?', o: ['Vì vàng không tác dụng với oxygen trong không khí', 'Vì vàng cứng', 'Vì vàng dẫn điện tốt', 'Vì vàng nặng'], a: 0 },
]);
resetBurn(); setMode('bench'); ready();
window.dbg = { lab, bench, S };
</script></body></html>
