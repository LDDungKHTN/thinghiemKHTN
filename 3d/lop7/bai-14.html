<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 14. Phản xạ âm, chống ô nhiễm tiếng ồn</title>
<link rel="stylesheet" href="../core/ui.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { createLab, THREE, MAT, TEX, roundBox, canvasTex, clamp } from '../core/lab3d.js';
import { tick } from '../core/sound.js';
import { shell, ready, toast, quiz, $, fmt } from '../core/ui.js';

const stage = shell({
  title: 'Bài 14. Phản xạ âm, chống ô nhiễm tiếng ồn', sub: 'KHTN 7 – Kết nối tri thức',
  panes: [
    { id: 'p1', title: 'Hướng dẫn', html: `
<p class="note sm">Bật loa của máy để nghe tiếng tích tắc phản xạ.</p>
<h3>Thí nghiệm: vật phản xạ âm tốt, vật phản xạ âm kém (Hình 14.3)</h3>
<p><b>Dụng cụ:</b> hộp làm bằng vật liệu cách âm (1); tấm gỗ nhẵn, tấm gỗ sần sùi, tấm xốp mềm (2); đồng hồ để bàn nhỏ làm nguồn âm (3); giá đỡ tấm phản xạ (4).</p>
<ol><li>Gắn tấm gỗ nhẵn lên giá, đặt tai ở vị trí như Hình 14.3, lắng nghe âm phản xạ.</li><li>Lần lượt thay bằng tấm gỗ sần sùi, tấm xốp; so sánh độ to của âm phản xạ.</li></ol>
<div class="row"><b>Tấm phản xạ:</b><button class="btn on" data-m="0">Gỗ nhẵn</button><button class="btn g" data-m="1">Gỗ sần sùi</button><button class="btn g" data-m="2">Xốp mềm</button><button class="btn g" data-m="3">Không có tấm</button></div>
<h3>Ứng dụng: đo độ sâu của biển (Hình 14.2)</h3><p>Bấm <b>“Đo độ sâu biển”</b>: tàu phát sóng siêu âm xuống đáy biển, đo thời gian t thu được âm phản xạ. Tốc độ âm trong nước biển 1 500 m/s: <b>h = v·t / 2</b>.</p>` },
    { id: 'p2', title: 'Kết luận', html: `<div id="obs" class="note">Lắng nghe âm phản xạ.</div>
<table class="dt"><thead><tr><th>Tấm phản xạ</th><th>Âm phản xạ nghe được</th></tr></thead><tbody id="tb"></tbody></table>
<ul><li>Âm dội lại khi gặp một mặt chắn gọi là <b>âm phản xạ</b>. Âm phản xạ đến tai chậm hơn âm truyền trực tiếp ít nhất 1/15 giây thì có <b>tiếng vang</b>.</li><li>Vật cứng, bề mặt nhẵn <b>phản xạ âm tốt</b>; vật mềm, xốp, bề mặt sần sùi <b>phản xạ âm kém</b> (hấp thụ âm tốt).</li><li>Chống ô nhiễm tiếng ồn: tác động vào nguồn âm, phân tán âm trên đường truyền, ngăn cản âm truyền tới tai.</li></ul>` },
    { id: 'p3', title: 'Câu hỏi', html: `<div id="qz"></div>` },
  ]
});
const H1 = [[.08, .4, .78], [.08, .12, 0]], H2 = [[.62, .32, .62], [.62, .1, -.05]];
const lab = createLab(stage, { cam: H1[0], target: H1[1], table: 'wood', tableSize: [1.7, .8], minDist: .06 });
const { scene } = lab;
const hud = document.createElement('div'); hud.className = 'hud'; stage.appendChild(hud);
const MATS = [{ n: 'Gỗ nhẵn', k: .85, c: 0xc89a5e, r: .25 }, { n: 'Gỗ sần sùi', k: .35, c: 0x9b7442, r: 1 }, { n: 'Xốp mềm', k: .08, c: 0xf2f2ec, r: 1 }, { n: 'Không có tấm', k: .02 }];
const S = { m: 0, ph: 0, rows: {} };
// hộp cách âm + ống hướng âm + đồng hồ
const box = new THREE.Group(); box.position.set(-.12, 0, .02); scene.add(box);
const foam = new THREE.MeshStandardMaterial({ color: 0x4a4f57, roughness: 1, map: canvasTex(128, 128, (c, w, h) => { c.fillStyle = '#4a4f57'; c.fillRect(0, 0, w, h); for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) { c.fillStyle = (i + j) % 2 ? '#3f444b' : '#555b63'; c.fillRect(i * 8, j * 8, 8, 8); } }) });
for (const [w, h, d, x, y, z] of [[.12, .01, .12, 0, .005, 0], [.12, .09, .01, 0, .045, -.055], [.12, .09, .01, 0, .045, .055], [.01, .09, .12, -.055, .045, 0], [.01, .09, .12, .055, .045, 0]]) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), foam); m.position.set(x, y, z); box.add(m); }
const clock = new THREE.Group(); clock.position.set(0, .03, 0); box.add(clock);
const cb = new THREE.Mesh(new THREE.CylinderGeometry(.022, .022, .012, 32), MAT.plastic(0xc92a2a, .4)); cb.rotation.x = Math.PI / 2; clock.add(cb);
const cf = new THREE.Mesh(new THREE.CircleGeometry(.019, 32), new THREE.MeshStandardMaterial({ map: canvasTex(128, 128, (c, w, h) => { c.fillStyle = '#fff'; c.beginPath(); c.arc(64, 64, 64, 0, 7); c.fill(); c.fillStyle = '#111'; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28; c.fillRect(64 + Math.sin(a) * 52 - 2, 64 - Math.cos(a) * 52 - 2, 4, 4); } c.fillRect(62, 24, 4, 42); c.fillRect(62, 60, 30, 4); }) })); cf.position.z = .0061; clock.add(cf);
lab.label(box, 'Hộp cách âm (1) + đồng hồ (3)', [0, .12, 0]);
const tube = new THREE.Mesh(new THREE.CylinderGeometry(.022, .022, .16, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0x9aa3ad, side: THREE.DoubleSide, roughness: .5 })); tube.position.set(-.12 + .06, .14, .02); tube.rotation.z = -.75; scene.add(tube);
// giá + tấm phản xạ
const stand = new THREE.Group(); stand.position.set(.12, 0, .02); scene.add(stand);
const sb = roundBox(.08, .01, .08, .003, MAT.metal(0x2d3136, .45)); sb.position.y = .005; stand.add(sb);
const sr = new THREE.Mesh(new THREE.CylinderGeometry(.004, .004, .3, 12), MAT.metal(0xc8cdd2, .25)); sr.position.set(.03, .15, 0); stand.add(sr);
const plate = new THREE.Mesh(new THREE.BoxGeometry(.012, .14, .12), new THREE.MeshStandardMaterial({ color: 0xc89a5e })); plate.position.set(0, .23, 0); plate.rotation.z = .7; stand.add(plate);
lab.label(plate, 'Tấm phản xạ (2)', [.0, .1, 0]); lab.shadow(stand);
// đầu người nghe
const head = new THREE.Group(); head.position.set(.32, .14, .02); scene.add(head);
const skin = new THREE.MeshStandardMaterial({ color: 0xe8b98f, roughness: .6 });
const hd = new THREE.Mesh(new THREE.SphereGeometry(.045, 32, 24), skin); hd.scale.set(.9, 1.1, 1); head.add(hd);
const hair = new THREE.Mesh(new THREE.SphereGeometry(.047, 32, 24, 0, 6.3, 0, 1.4), new THREE.MeshStandardMaterial({ color: 0x1b1410, roughness: .8 })); hair.scale.set(.9, 1.1, 1); head.add(hair);
const ear = new THREE.Mesh(new THREE.TorusGeometry(.009, .004, 8, 16), skin); ear.position.set(-.04, 0, 0); ear.rotation.y = Math.PI / 2; head.add(ear);
lab.label(head, 'Tai người nghe', [0, .07, 0]);
// sóng âm (vòng cung) đi lên tấm rồi tới tai
const arcs = [];
for (let i = 0; i < 6; i++) { const a = new THREE.Mesh(new THREE.TorusGeometry(.02, .0018, 6, 24, 1.6), new THREE.MeshBasicMaterial({ color: 0x5ab0ff, transparent: true, opacity: 0, depthWrite: false })); scene.add(a); arcs.push(a); }
const P0 = new THREE.Vector3(-.08, .19, .02), P1 = new THREE.Vector3(.12, .23, .02), P2 = new THREE.Vector3(.29, .14, .02);
// thang đo độ to
const meter = canvasTex(256, 64, () => { });
const mm = new THREE.Mesh(new THREE.PlaneGeometry(.1, .025), new THREE.MeshStandardMaterial({ map: meter, emissive: 0xffffff, emissiveMap: meter, emissiveIntensity: .7 })); mm.position.set(.32, .24, .02); scene.add(mm);
function drawMeter(k) { const c = meter.image.getContext('2d'); c.fillStyle = '#111'; c.fillRect(0, 0, 256, 64); for (let i = 0; i < 20; i++) { c.fillStyle = i < k * 20 ? (i < 12 ? '#40c057' : i < 16 ? '#fab005' : '#fa5252') : '#333'; c.fillRect(8 + i * 12, 14, 9, 36); } meter.needsUpdate = true; }

/* ===== Đo độ sâu biển ===== */
const SEA = new THREE.Group(); SEA.position.set(.62, 0, -.05); scene.add(SEA);
const waterB = new THREE.Mesh(new THREE.BoxGeometry(.32, .2, .12), new THREE.MeshPhysicalMaterial({ color: 0x1c6ea4, transparent: true, opacity: .45, roughness: .1, depthWrite: false })); waterB.position.y = .1; SEA.add(waterB);
const bed = new THREE.Mesh(new THREE.BoxGeometry(.32, .02, .12), new THREE.MeshStandardMaterial({ color: 0xb59a64, roughness: 1 })); bed.position.y = .01; SEA.add(bed);
const ship = new THREE.Group(); ship.position.set(-.04, .205, 0); SEA.add(ship);
const hull = roundBox(.09, .02, .03, .006, MAT.plastic(0xd9480f, .4)); ship.add(hull); const cabn = roundBox(.03, .02, .02, .004, MAT.plastic(0xf1f3f5, .4)); cabn.position.set(-.01, .02, 0); ship.add(cabn);
lab.label(SEA, 'Mô hình đo độ sâu biển', [0, .27, 0]);
const pulse = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12, 0, 6.3, Math.PI / 2, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xaee4ff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })); SEA.add(pulse);
const SO = { t: -1, depth: 0 };

lab.onTick((dt, t) => {
  // tích tắc mỗi giây
  const k = MATS[S.m].k, ph = Math.floor(t); if (ph != S.ph) { S.ph = ph; tick(.05 + .55 * k); S.flash = 0; }
  S.flash = (S.flash ?? 1) + dt;
  arcs.forEach((a, i) => { const f = ((t + i / 6) % 1); const seg = f < .5; const p = seg ? P0.clone().lerp(P1, f * 2) : P1.clone().lerp(P2, (f - .5) * 2); a.position.copy(p); const dir = seg ? P1.clone().sub(P0) : P2.clone().sub(P1); a.rotation.set(0, 0, Math.atan2(dir.y, dir.x) - .8); a.scale.setScalar(.6 + f * 1.5); a.material.opacity = (seg ? .7 : .7 * k) * (1 - f * .6); });
  drawMeter(k * (S.flash < .15 ? 1 : .15));
  if (SO.t >= 0) { SO.t += dt; const v = .12, d = SO.depthM, Tm = 2 * d / 1500, T = .7; const f = SO.t / T, H = .19; let r, op;
    if (f < .5) { r = f * 2 * H; op = .6; } else if (f < 1) { r = (1 - (f - .5) * 2) * H; op = .45; } else { r = 0; op = 0; }
    pulse.position.set(-.04, .195 - (f < .5 ? 0 : 0), 0); pulse.scale.set(.03 + r * .3, Math.max(.001, r), .03 + r * .3); pulse.material.opacity = op; pulse.rotation.x = f < .5 ? 0 : Math.PI; if (f >= .5 && f < 1) pulse.position.y = .02 + (1 - (f - .5) * 2) * 0;
    if (f >= 1 && !SO.done) { SO.done = true; hud.innerHTML = `Thời gian từ lúc phát đến lúc thu sóng phản xạ: t = <b>${fmt(Tm, 2)} s</b><br>Độ sâu h = v·t/2 = 1500 · ${fmt(Tm, 2)} / 2 = <b>${fmt(d, 0)} m</b>`; } void v; }
});
function setM(i) { S.m = i; document.querySelectorAll('[data-m]').forEach(b => { b.classList.toggle('on', +b.dataset.m == i); b.classList.toggle('g', +b.dataset.m != i); }); const M = MATS[i]; plate.visible = i < 3; if (i < 3) { plate.material.color.set(M.c); plate.material.roughness = M.r; plate.material.map = i == 1 ? TEX.wood() : null; plate.material.needsUpdate = true; }
  const txt = i == 3 ? 'Không có tấm phản xạ: hầu như <b>không nghe thấy</b> tiếng tích tắc.' : `${M.n}: âm phản xạ nghe được <b>${M.k > .6 ? 'rõ, to' : M.k > .2 ? 'nhỏ hơn' : 'rất nhỏ, gần như không nghe thấy'}</b> → ${M.k > .6 ? 'phản xạ âm tốt' : 'phản xạ âm kém'}.`;
  hud.innerHTML = txt; $('#obs').innerHTML = txt; S.rows[i] = txt.replace(/<[^>]+>/g, ''); $('#tb').innerHTML = Object.entries(S.rows).map(([j, r]) => `<tr><td>${MATS[j].n}</td><td>${r.split(':').slice(1).join(':') || r}</td></tr>`).join(''); }
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { setM(+b.dataset.m); lab.view(...H1); });
const tb = document.createElement('div'); tb.className = 'tb'; stage.appendChild(tb);
tb.innerHTML = `<button class="btn p" id="bSea">Đo độ sâu biển</button><button class="btn" id="bH">Thí nghiệm phản xạ âm</button><button class="btn" id="bLbl">Tên</button>`;
$('#bSea').onclick = () => { lab.view(...H2); SO.depthM = 600 + Math.round(Math.random() * 30) * 100; SO.t = 0; SO.done = false; bed.position.y = .01; hud.innerHTML = 'Tàu phát sóng siêu âm xuống đáy biển…'; };
$('#bH').onclick = () => lab.view(...H1);
let lbl = true; $('#bLbl').onclick = () => { lbl = !lbl; lab.showLabels(lbl); $('#bLbl').classList.toggle('on', !lbl); };
quiz($('#qz'), [
  { q: 'Vật nào phản xạ âm tốt?', o: ['Ghế đệm mút', 'Mặt gương, tấm kim loại, mặt tường gạch', 'Rèm nhung', 'Tấm xốp'], a: 1 },
  { q: 'Vì sao tường của nhà hát, rạp chiếu phim thường được làm sần sùi hoặc treo rèm nhung?', o: ['Để trang trí', 'Để hấp thụ âm, giảm âm phản xạ (tiếng vang)', 'Để phản xạ âm tốt hơn', 'Để cách nhiệt'], a: 1 },
  { q: 'Tàu phát siêu âm và nhận âm phản xạ sau 1,4 s. Tốc độ âm trong nước biển 1 500 m/s. Độ sâu của biển là bao nhiêu mét?', n: 1050, u: 'm', e: 'h = 1500·1,4/2 = 1 050 m.' },
  { q: 'Ta nghe được tiếng vang khi âm phản xạ đến tai chậm hơn âm trực tiếp ít nhất', o: ['1/5 giây', '1/15 giây', '1 giây', '15 giây'], a: 1 },
  { q: 'Biện pháp nào giúp chống ô nhiễm tiếng ồn trên đường truyền âm?', o: ['Trồng nhiều cây xanh, xây tường cách âm', 'Bấm còi liên tục', 'Mở to loa', 'Mở cửa sổ'], a: 0 },
]);
setM(0); ready(); window.dbg = { lab };
</script></body></html>
