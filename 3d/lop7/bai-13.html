<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 13. Độ to và độ cao của âm</title>
<link rel="stylesheet" href="../core/ui.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { createLab, THREE, MAT, roundBox, clamp } from '../core/lab3d.js';
import { tone, scope } from '../core/sound.js';
import { cable } from '../core/kit.js';
import { shell, ready, toast, quiz, $, fmt } from '../core/ui.js';

const stage = shell({
  title: 'Bài 13. Độ to và độ cao của âm', sub: 'KHTN 7 – Kết nối tri thức',
  panes: [
    { id: 'p1', title: 'Hướng dẫn', html: `
<p class="note sm">Bật loa của máy để nghe âm thanh.</p>
<h3>1. Biên độ dao động và độ to của âm (Hình 13.2)</h3>
<p>Âm thoa đặt trước micrô nối với máy dao động kí. <b>Gõ nhẹ</b> rồi <b>gõ mạnh</b> vào âm thoa; so sánh đường biểu diễn trên màn hình và độ to của âm nghe được.</p>
<h3>2. Tần số và độ cao của âm (Hình 13.4)</h3>
<p>Lần lượt gõ <b>âm thoa 256 Hz</b> và <b>âm thoa 512 Hz</b> với cùng độ mạnh. So sánh số dao động trên màn hình và độ cao (bổng, trầm) của âm.</p>
<div class="row"><b>Âm thoa trước micrô:</b><button class="btn on" data-f="256">256 Hz</button><button class="btn g" data-f="512">512 Hz</button><button class="btn g" data-f="880">880 Hz</button></div>
<div class="row"><b>Gõ:</b><button class="btn p" data-a=".35">Gõ nhẹ</button><button class="btn o" data-a="1">Gõ mạnh</button></div>
<div class="note">Màn hình: mỗi ô ngang = 2 ms. Đếm số dao động trong 10 ô (20 ms) rồi nhân 50 để ra tần số (số dao động trong 1 s).</div>` },
    { id: 'p2', title: 'Kết luận', html: `<div id="obs" class="note">Gõ âm thoa để quan sát.</div>
<ul><li><b>Biên độ dao động</b> là khoảng cách từ vị trí cân bằng đến vị trí xa nhất. Nguồn âm dao động với biên độ càng lớn thì biên độ sóng âm càng lớn, <b>âm nghe được càng to</b>.</li>
<li><b>Tần số</b> là số dao động vật thực hiện được trong 1 giây, đơn vị héc (Hz). Tần số càng lớn thì <b>âm nghe được càng cao (bổng)</b>; tần số càng nhỏ thì âm càng thấp (trầm).</li>
<li>Tai người nghe được âm có tần số từ khoảng 20 Hz đến 20 000 Hz.</li></ul>
<table class="dt"><thead><tr><th>Âm thoa</th><th>Gõ</th><th>Biên độ trên màn</th><th>Âm nghe được</th></tr></thead><tbody id="tb"></tbody></table>` },
    { id: 'p3', title: 'Câu hỏi', html: `<div id="qz"></div>` },
  ]
});
const HOME = [[0, .42, .8], [0, .09, 0]];
const lab = createLab(stage, { cam: HOME[0], target: HOME[1], table: 'wood', tableSize: [1.4, .8], minDist: .06 });
const { scene } = lab;
const hud = document.createElement('div'); hud.className = 'hud'; stage.appendChild(hud);
const steel = MAT.metal(0xd2d6db, .25);
const sc = scope(lab, [.17, 0, -.05], { tb: .002 }); sc.g.rotation.y = -.35;
function forkSet(x, f, len) {
  const G = new THREE.Group(); G.position.set(x, 0, .02); scene.add(G);
  const box = roundBox(.12, .05, .06, .004, new THREE.MeshStandardMaterial({ color: 0xb9874f, roughness: .6 })); box.position.y = .025; G.add(box);
  const fk = new THREE.Group(); fk.position.y = .05; G.add(fk);
  const st = new THREE.Mesh(new THREE.CylinderGeometry(.0035, .0035, .03, 12), steel); st.position.y = .015; fk.add(st);
  const ub = new THREE.Mesh(new THREE.TorusGeometry(.009, .0035, 10, 20, Math.PI), steel); ub.rotation.z = Math.PI; ub.position.y = .039; fk.add(ub);
  const pr = [-1, 1].map(s => { const p = new THREE.Mesh(new THREE.BoxGeometry(.006, len, .007), steel); p.geometry.translate(0, len / 2, 0); p.position.set(s * .009, .039, 0); fk.add(p); return p; });
  lab.label(G, f + ' Hz', [0, .06 + len + .04, 0], 'big'); lab.shadow(G);
  const api = { G, f, pr, A: 0, t0: 0 };
  lab.clickable(G, () => hit(api, .7));
  return api;
}
const forks = { 256: forkSet(-.2, 256, .12), 512: forkSet(-.06, 512, .085), 880: forkSet(.06, 880, .065) };
// micrô trên giá
const mic = new THREE.Group(); scene.add(mic);
const mb = roundBox(.06, .01, .06, .003, MAT.metal(0x2d3136, .45)); mb.position.y = .005; mic.add(mb);
const mr = new THREE.Mesh(new THREE.CylinderGeometry(.003, .003, .14, 10), MAT.metal(0xc8cdd2, .25)); mr.position.y = .07; mic.add(mr);
const mh = new THREE.Mesh(new THREE.CapsuleGeometry(.008, .03, 6, 16), MAT.plastic(0x222222, .4)); mh.rotation.z = Math.PI / 2; mh.position.set(-.02, .14, 0); mic.add(mh);
const grill = new THREE.Mesh(new THREE.SphereGeometry(.011, 16, 12), MAT.metal(0x8a8f95, .5)); grill.position.set(-.04, .14, 0); mic.add(grill);
lab.label(mic, 'Micrô', [0, .17, 0]); lab.shadow(mic);
let cur = 256, mcable = null;
function placeMic() { const F = forks[cur]; mic.position.set(F.G.position.x + .08, 0, .07); lab.remove(mcable); const a = mic.localToWorld(new THREE.Vector3(0, .01, -.02)), b = sc.g.localToWorld(new THREE.Vector3(-.08, .02, .08)); mcable = cable([a.x, a.y, a.z], [b.x, b.y, b.z], { color: 0x222222, sag: .03, r: .0018 }); scene.add(mcable); }
const rows = [];
function hit(F, a) {
  F.A = a; F.t0 = performance.now() / 1000; tone(F.f, .55 * a, 1.6);
  if (F.f == cur) sc.set({ f: F.f, A: a, tau: 1.6 });
  const loud = a > .5 ? 'to' : 'nhỏ', pitch = F.f >= 800 ? 'rất cao (bổng)' : F.f >= 500 ? 'cao (bổng)' : 'thấp (trầm)';
  const t = F.f == cur ? `Âm thoa ${F.f} Hz – gõ ${a > .5 ? 'mạnh' : 'nhẹ'}: đường biểu diễn có biên độ <b>${a > .5 ? 'lớn' : 'nhỏ'}</b>, ${F.f * .02} dao động trong 20 ms → f = ${F.f} Hz. Âm nghe được <b>${loud}</b>, <b>${pitch}</b>.` : `Âm thoa ${F.f} Hz đang kêu nhưng không đặt trước micrô.`;
  hud.innerHTML = t; $('#obs').innerHTML = t;
  if (F.f == cur) { rows.push([F.f + ' Hz', a > .5 ? 'Mạnh' : 'Nhẹ', a > .5 ? 'Lớn' : 'Nhỏ', `${loud}, ${pitch}`]); $('#tb').innerHTML = rows.slice(-8).map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join(''); }
}
lab.onTick((dt, t) => { Object.values(forks).forEach(F => { const a = F.A * Math.exp(-(performance.now() / 1000 - F.t0) / 1.6); F.pr.forEach((p, i) => p.rotation.z = (i ? 1 : -1) * a * .015 * Math.sin(t * 2 * Math.PI * (F.f / 7))); }); });
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { cur = +b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => { x.classList.toggle('on', x == b); x.classList.toggle('g', x != b); }); placeMic(); toast('Đặt âm thoa ' + cur + ' Hz trước micrô'); });
document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => hit(forks[cur], +b.dataset.a));
const tb = document.createElement('div'); tb.className = 'tb'; stage.appendChild(tb);
tb.innerHTML = `<button class="btn p" id="b1">Gõ nhẹ</button><button class="btn o" id="b2">Gõ mạnh</button><button class="btn" id="bS">Nhìn màn hình</button><button class="btn" id="bLbl">Tên</button>`;
$('#b1').onclick = () => hit(forks[cur], .35); $('#b2').onclick = () => hit(forks[cur], 1);
let nearS = false; $('#bS').onclick = () => { nearS = !nearS; nearS ? lab.view([.12, .15, .2], [.16, .085, -.05]) : lab.view(...HOME); $('#bS').textContent = nearS ? 'Toàn cảnh' : 'Nhìn màn hình'; };
let lbl = true; $('#bLbl').onclick = () => { lbl = !lbl; lab.showLabels(lbl); $('#bLbl').classList.toggle('on', !lbl); };
quiz($('#qz'), [
  { q: 'Một dây đàn ghi-ta dao động 880 lần mỗi giây. Tần số của nó là bao nhiêu Hz?', n: 880, u: 'Hz' },
  { q: 'Mặt trống dao động với tần số 100 Hz thực hiện được bao nhiêu dao động trong 1 phút?', n: 6000, u: 'dao động' },
  { q: 'Con ong mật bay đập cánh 3 300 lần trong 10 s. Tần số dao động của cánh ong là bao nhiêu Hz?', n: 330, u: 'Hz' },
  { q: 'Gõ mạnh vào âm thoa thì', o: ['tần số tăng, âm cao hơn', 'biên độ dao động lớn hơn, âm to hơn', 'âm nhỏ hơn', 'không thay đổi gì'], a: 1 },
  { q: 'Âm thoa 512 Hz phát ra âm so với âm thoa 256 Hz', o: ['thấp hơn', 'cao (bổng) hơn', 'to hơn', 'nhỏ hơn'], a: 1 },
  { q: 'Tai người nghe được âm có tần số trong khoảng', o: ['0 – 20 Hz', '20 Hz – 20 000 Hz', '20 000 – 100 000 Hz', 'mọi tần số'], a: 1 },
]);
placeMic(); hud.innerHTML = 'Gõ âm thoa (nút bên dưới, hoặc bấm vào âm thoa).'; ready();
window.dbg = { lab, sc, forks };
</script></body></html>
