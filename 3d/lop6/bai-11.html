<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 11. Oxygen. Không khí</title>
<link rel="stylesheet" href="../core/ui.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { createLab, THREE, MAT, lathe, canvasTex, clamp, lerp } from '../core/lab3d.js';
import { vessel } from '../core/chem.js';
import { candle } from '../core/candle.js';
import { shell, ready, toast, quiz, $, fmt, showPane } from '../core/ui.js';

const stage = shell({
  title: 'Bài 11. Oxygen. Không khí', sub: 'KHTN 6 – Kết nối tri thức',
  panes: [
    { id: 'p1', title: 'Hướng dẫn', html: `
<h3>1. Chứng minh trong không khí có hơi nước (Hình 11.4)</h3><p>Cho nước pha màu vào 2 ống nghiệm A và B. Cho vài viên nước đá vào ống A rồi đậy nút cả hai ống. Quan sát thành ngoài hai ống.</p>
<div class="row"><button class="btn p" id="ice">Cho nước đá vào ống A</button><button class="btn" id="v1">Nhìn gần</button></div>
<h3>2. Xác định thành phần thể tích oxygen trong không khí (Hình 11.5)</h3><ol id="st"><li>Đặt cây nến vào giữa đế trong chậu chứa nước vôi trong, châm lửa cho nến cháy.</li><li>Nhanh chóng úp cốc thuỷ tinh (có vạch chia 5 phần) lên giá đỡ.</li><li>Quan sát: nến cháy một lúc rồi tắt, nước dâng lên trong cốc.</li></ol>
<div class="row"><button class="btn p" id="lit">Châm lửa nến</button><button class="btn o" id="cov">Úp cốc</button><button class="btn" id="rs">Làm lại</button><button class="btn" id="v2">Nhìn gần</button></div>` },
    { id: 'p2', title: 'Kết quả', html: `<table class="dt"><tbody><tr><td>Thành ngoài ống A (có đá)</td><td id="r1">?</td></tr><tr><td>Thành ngoài ống B</td><td id="r2">?</td></tr><tr><td>Nến trong cốc úp</td><td id="r3">?</td></tr><tr><td>Mực nước dâng trong cốc</td><td id="r4">?</td></tr></tbody></table>
<div class="note">Hơi nước trong không khí gặp thành ống lạnh ngưng tụ thành giọt nước ⇒ <b>không khí có hơi nước</b>. Nến tắt khi oxygen trong cốc đã hết; nước dâng lên chiếm chỗ oxygen đã mất, khoảng <b>1/5</b> chiều cao cốc ⇒ oxygen chiếm khoảng <b>21%</b> thể tích không khí (nitrogen 78%, 1% là carbon dioxide, hơi nước và khí khác).</div>` },
    { id: 'p3', title: 'Câu hỏi', html: `<div id="qz"></div>` },
  ]
});
const HOME = [[0, .32, .55], [0, .08, 0]];
const lab = createLab(stage, { cam: HOME[0], target: HOME[1], table: 'bench', tableSize: [1.2, .8], minDist: .05 });
const { scene } = lab;
const hud = document.createElement('div'); hud.className = 'hud'; stage.appendChild(hud);
// ---- phần 1: ống A, B ----
const rack = new THREE.Group(); rack.position.set(-.28, 0, 0); scene.add(rack);
const rb = new THREE.Mesh(new THREE.BoxGeometry(.12, .006, .05), MAT.plastic(0xd9d2c3, .6)); rb.position.y = .045; rack.add(rb);
for (const x of [-.055, .055]) { const l = new THREE.Mesh(new THREE.BoxGeometry(.006, .048, .05), MAT.plastic(0xd9d2c3, .6)); l.position.set(x, .024, 0); rack.add(l); }
const TB = [-.03, .03].map((x, i) => { const v = vessel(lab, { kind: 'tube', R: .011, H: .15 }); v.g.position.set(x, .004, 0); rack.add(v.g); v.set({ level: .55, color: 0x4dabf7, op: .7 });
  const stp = new THREE.Mesh(new THREE.CylinderGeometry(.0125, .0105, .018, 20), new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: .8 })); stp.position.y = .158; v.g.add(stp);
  lab.label(v.g, i ? 'B' : 'A', [0, .19, 0]); return v; });
const iceG = new THREE.Group(); iceG.visible = false; TB[0].g.add(iceG);
for (let i = 0; i < 5; i++) { const c = new THREE.Mesh(new THREE.BoxGeometry(.009, .009, .009), MAT.glassLite({ opacity: .7, color: 0xf2fbff })); c.position.set((i % 2 - .5) * .007, .075 + i * .007, (i % 3 - 1) * .003); c.rotation.set(i, i * 2, 0); iceG.add(c); }
const drops = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: .55, roughness: 0, clearcoat: 1 }), 260); drops.count = 0; TB[0].g.add(drops);
const D = [...Array(260)].map(() => { const a = Math.random() * 6.28, y = .005 + Math.random() * .085; return { a, y, r: .0004 + Math.random() * .0007 }; });
lab.shadow(rack);
// ---- phần 2: chậu, nến, cốc ----
const P = new THREE.Group(); P.position.set(.12, 0, 0); scene.add(P);
const basin = new THREE.Mesh(lathe([[0, 0], [.13, 0], [.14, .05], [.137, .05], [.127, .003], [0, .003]], 48), MAT.glassLite({ opacity: .25 })); P.add(basin);
const lime = new THREE.Mesh(new THREE.CylinderGeometry(.13, .128, .03, 48), new THREE.MeshPhysicalMaterial({ color: 0xe6eef0, transparent: true, opacity: .45, depthWrite: false })); lime.position.y = .018; lime.renderOrder = 1; P.add(lime);
const stand = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .036, 32), MAT.plastic(0x6c757d, .5)); stand.position.y = .02; P.add(stand);
const C = candle(lab, { h: .045, r: .007 }); C.g.position.y = .038; P.add(C.g); C.setLit(false);
const CH = .17, CR = .055;
const cupG = new THREE.Group(); P.add(cupG);
const cupTex = canvasTex(256, 512, (c, w, h) => { c.clearRect(0, 0, w, h); c.fillStyle = 'rgba(30,30,30,.9)'; c.font = 'bold 30px Arial'; for (let i = 0; i <= 4; i++) { const y = h - i * h / 5 - (i ? 0 : 4); c.fillRect(20, y - 2, 60, 4); c.fillText(String(i), 90, y + 10); } });
const cup = new THREE.Mesh(lathe([[CR, 0], [CR, CH], [0, CH + .002], [0, CH + .004], [CR + .002, CH + .003], [CR + .002, 0]], 48), MAT.glassLite({ opacity: .22 })); cup.renderOrder = 4; cupG.add(cup);
const marks = new THREE.Mesh(new THREE.CylinderGeometry(CR + .0025, CR + .0025, CH - .033, 32, 1, true, -.5, 1), new THREE.MeshBasicMaterial({ map: cupTex, transparent: true, depthWrite: false })); marks.position.y = .033 + (CH - .033) / 2; marks.renderOrder = 5; cupG.add(marks);
const inW = new THREE.Mesh(new THREE.CylinderGeometry(CR - .001, CR - .001, 1, 40), new THREE.MeshPhysicalMaterial({ color: 0xc9dfe6, transparent: true, opacity: .7, depthWrite: false })); inW.renderOrder = 2; inW.visible = false; P.add(inW);
const inS = new THREE.Mesh(new THREE.RingGeometry(CR - .004, CR - .001, 48), new THREE.MeshBasicMaterial({ color: 0x5f8f9c, transparent: true, opacity: .8, side: THREE.DoubleSide, depthWrite: false })); inS.rotation.x = -Math.PI / 2; inS.visible = false; P.add(inS);
const smoke = new THREE.Mesh(new THREE.CylinderGeometry(CR - .002, CR - .002, 1, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })); smoke.renderOrder = 3; P.add(smoke);
cupG.position.set(.2, 0, .02);
lab.label(P, 'Chậu nước vôi trong', [-.13, .07, .08]); lab.label(cupG, 'Cốc thuỷ tinh (chia 5 phần)', [0, CH + .03, 0]); lab.label(C.g, 'Nến', [.03, .06, 0]);
lab.shadow(P);
// ---- trạng thái ----
const S = { ice: false, t1: 0, lit: false, cov: false, k: 0, O2: 1, lev: 0, out: false, tc: 0 };
const W0 = .033;       // mực nước chậu
$('#ice').onclick = () => { if (S.ice) return; S.ice = true; iceG.visible = true; TB[0].set({ color: 0x74c0fc }); toast('Theo dõi thành ngoài hai ống nghiệm…'); };
$('#v1').onclick = () => lab.view([-.24, .12, .17], [-.28, .07, 0]);
$('#v2').onclick = () => lab.view([.18, .16, .32], [.12, .09, 0]);
$('#lit').onclick = () => { if (S.cov) return toast('Bấm “Làm lại” để làm lần mới'); S.lit = true; C.setLit(true); mark(1); };
$('#cov').onclick = () => { if (!S.lit) return toast('Châm lửa nến trước'); if (S.cov) return; S.cov = true; S.tc = 0; mark(2); };
$('#rs').onclick = () => { Object.assign(S, { lit: false, cov: false, k: 0, O2: 1, lev: 0, out: false, tc: 0 }); C.setLit(false); cupG.position.set(.2, 0, .02); inW.visible = inS.visible = false; smoke.material.opacity = 0; mark(0); S.done = false; $('#r3').textContent = $('#r4').textContent = '?'; };
function mark(n) { document.querySelectorAll('#st li').forEach((li, i) => li.style.color = i < n ? '#2f9e44' : ''); }
lab.onTick((dt, t) => {
  // hơi nước ngưng tụ
  if (S.ice) { S.t1 += dt; const n = Math.min(260, Math.floor(S.t1 * 25)); drops.count = n; const m = new THREE.Matrix4();
    for (let i = 0; i < n; i++) { const d = D[i], r = d.r * Math.min(1, .3 + (S.t1 - i / 25) * .25); m.makeScale(r, r * 1.2, r).setPosition(Math.cos(d.a) * .0125, d.y, Math.sin(d.a) * .0125); drops.setMatrixAt(i, m); } drops.instanceMatrix.needsUpdate = true;
    if (S.t1 > 3) { $('#r1').textContent = 'Xuất hiện nhiều giọt nước nhỏ bám bên ngoài'; $('#r2').textContent = 'Khô, không có giọt nước'; } }
  // úp cốc
  if (S.cov) { S.tc += dt; const k = clamp(S.tc / .8, 0, 1); const e = k * k * (3 - 2 * k); cupG.position.set(lerp(.2, 0, Math.min(1, e * 1.25)), .003 + Math.sin(e * Math.PI) * .17, lerp(.02, 0, e));
    if (k >= 1) { if (S.lit) { S.O2 = Math.max(0, S.O2 - dt / 6); const f = .25 + .75 * S.O2; C.flame.scale.multiplyScalar(f); if (S.O2 <= 0) { S.lit = false; C.setLit(false); S.out = true; toast('Nến đã tắt – oxygen trong cốc đã hết.'); $('#r3').textContent = 'Cháy một lúc rồi tắt'; smoke.material.opacity = .25; } }
      const target = S.out ? .2 : (1 - S.O2) * .1; S.lev += (target - S.lev) * Math.min(1, dt * (S.out ? .6 : 1.5));
      const h = W0 + S.lev * (CH - W0); inW.visible = inS.visible = true; inS.position.y = h; inW.scale.y = Math.max(.001, h - .003); inW.position.y = .003 + inW.scale.y / 2; inW.material.color.setHex(S.out ? 0xc3d3d8 : 0xc9dfe6);
      smoke.material.opacity = Math.max(0, smoke.material.opacity - dt * .03); smoke.scale.y = CH - h; smoke.position.y = h + (CH - h) / 2;
      if (S.out && S.lev > .19 && !S.done) { S.done = true; $('#r4').textContent = 'Dâng lên khoảng 1/5 chiều cao cốc (vạch 1)'; toast('Nước dâng lên khoảng 1/5 cốc ⇒ oxygen chiếm khoảng 1/5 (≈ 21%) thể tích không khí.', 4500); } } }
  const h = `Ống A: ${S.ice ? (S.t1 > 3 ? '<b>có giọt nước bám ngoài</b>' : 'đang lạnh dần…') : 'chưa cho đá'} · Ống B: khô<br>Nến: <b>${S.lit ? 'đang cháy' : S.out ? 'đã tắt' : 'chưa châm'}</b>${S.cov ? ' · nước dâng ≈ <b>' + fmt(S.lev * 5, 1) + '/5</b> cốc' : ''}`; if (h != hud.innerHTML) hud.innerHTML = h;
});
quiz($('#qz'), [
  { q: 'Oxygen chiếm khoảng bao nhiêu phần trăm thể tích không khí?', o: ['78%', '21%', '1%', '50%'], a: 1 },
  { q: 'Khí chiếm phần trăm thể tích lớn nhất trong không khí là', o: ['oxygen', 'carbon dioxide', 'nitrogen', 'hơi nước'], a: 2 },
  { q: 'Hiện tượng nào chứng tỏ trong không khí có hơi nước?', o: ['Có giọt nước bám ngoài thành ống nghiệm chứa nước đá', 'Nến tắt', 'Nước vôi vẩn đục', 'Nước dâng lên trong cốc'], a: 0 },
  { q: 'Vì sao nến tắt sau một thời gian khi úp cốc?', o: ['Vì oxygen trong cốc đã hết', 'Vì cốc quá nóng', 'Vì nước làm tắt', 'Vì hết sáp'], a: 0 },
  { q: 'Vai trò của nước vôi trong trong thí nghiệm là', o: ['hấp thụ khí carbon dioxide sinh ra khi nến cháy', 'làm nến cháy lâu hơn', 'tạo oxygen', 'làm mát cốc'], a: 0 },
]);
ready(); window.dbg = { lab, S };
</script></body></html>
