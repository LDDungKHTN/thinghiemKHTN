<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 33. Thực hành: Quan sát các loại nấm</title>
<link rel="stylesheet" href="../core/ui.css">
<script src="../core/boot.js"></script>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z9HMXNJYEN"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-Z9HMXNJYEN');</script>
</head><body>
<script type="module">
import { createLab, THREE, MAT, lathe, tubeAlong } from '../core/lab3d.js';
import { wetMount } from '../core/wetmount.js';
import { shell, ready, toast, quiz, $ } from '../core/ui.js';

const stage = shell({
  title: 'Bài 33. Thực hành: Quan sát các loại nấm', sub: 'KHTN 6 – Kết nối tri thức',
  panes: [
    { id: 'p1', title: 'Hướng dẫn', html: `
<div class="warn sm">Đeo khẩu trang, găng tay. Rửa tay trước và sau khi làm thí nghiệm.</div>
<h3>1. Quan sát nấm mốc bằng kính hiển vi</h3><ol id="st">
<li>Dùng panh gắp một đám mốc nhỏ lên lam kính.</li>
<li>Nhỏ 1 – 2 giọt nước cất lên đám mốc (dùng kim tách nhẹ thành các mảnh nhỏ).</li>
<li>Đậy lamen lên, thấm nước thừa.</li>
<li>Quan sát bằng kính hiển vi ở vật kính 10x và 40x.</li></ol>
<div class="row"><button class="btn p" id="next">Làm bước tiếp theo</button><button class="btn" id="redo">Làm lại</button></div>
<div class="note sm">Trong thị kính, bấm vào các phần của mốc để biết tên (sợi nấm, túi bào tử).</div>
<h3>2. Quan sát cấu tạo nấm đảm (nấm mỡ, nấm rơm…)</h3><p>Quan sát cây nấm nguyên vẹn, sau đó bổ dọc ở chính giữa thân và mũ, đối chiếu Hình 33.4.</p>
<div class="row"><button class="btn p" id="mush">Xem cây nấm</button><button class="btn" id="cut">Bổ dọc / ghép lại</button><button class="btn" id="go1">Xem kính hiển vi</button></div>` },
    { id: 'p2', title: 'Kết quả', html: `<table class="dt"><tbody><tr><td>Nấm mốc (mắt thường, kính lúp)</td><td>Đám mốc màu trắng xám, xanh đen như bông, mọc trên bề mặt bánh mì</td></tr><tr><td>Nấm mốc (kính hiển vi)</td><td id="r1">?</td></tr><tr><td>Cấu tạo nấm đảm</td><td id="r2">?</td></tr></tbody></table>
<div class="note">Nấm mốc gồm nhiều <b>sợi nấm</b> phân nhánh (hệ sợi); đầu sợi có <b>túi bào tử</b> màu đen chứa bào tử. Nấm đảm có <b>mũ nấm, phiến nấm (dưới mũ), cổ nấm, cuống nấm, bao gốc</b> và <b>sợi nấm</b> ở gốc.</div>` },
    { id: 'p3', title: 'Câu hỏi', html: `<div id="qz"></div>` },
  ]
});
const HOME = [[0, .42, .55], [0, .08, 0]], MU = [[-.62, .17, .25], [-.62, .07, -.03]];
const lab = createLab(stage, { cam: HOME[0], target: HOME[1], table: 'bench', tableSize: [1.8, .8], minDist: .05 });
const { scene, renderer } = lab;
const hud = document.createElement('div'); hud.className = 'hud'; stage.appendChild(hud);
const parts = new Set();
const W = wetMount(lab, stage, { sample: 'mold', src: 'bread', srcLabel: 'Bánh mì bị mốc', onStep, onSeen, onPick });
function onStep(n) { document.querySelectorAll('#st li').forEach((li, i) => li.style.color = i < Math.min(n, 3) ? '#2f9e44' : ''); upd(); }
function onSeen(o) { document.querySelector('#st li:nth-child(4)').style.color = '#2f9e44'; toast('Thấy rõ nấm mốc. Bấm vào sợi nấm, túi bào tử để biết tên.'); upd(); }
function onPick(nm) { parts.add(nm); $('#r1').textContent = [...parts].join('; '); upd(); }
// ---- cây nấm đảm ----
renderer.localClippingEnabled = true;
const clip = new THREE.Plane(new THREE.Vector3(0, 0, -1), 10);
const mat = (c, r = .7) => new THREE.MeshStandardMaterial({ color: c, roughness: r, side: THREE.DoubleSide, clippingPlanes: [clip] });
const MG = new THREE.Group(); MG.position.set(-.62, 0, -.05); scene.add(MG);
const soil = new THREE.Mesh(new THREE.CylinderGeometry(.07, .075, .012, 40), new THREE.MeshStandardMaterial({ color: 0x5b4127, roughness: 1 })); soil.position.y = .006; MG.add(soil);
const fleshM = mat(0xf6efe2), capM = mat(0xe9dcc4, .6);
// cuống
const stem = new THREE.Mesh(lathe([[0, 0], [.009, 0], [.0085, .04], [.0075, .085], [.008, .09], [0, .09]], 32), fleshM); stem.position.y = .018; MG.add(stem);
// bao gốc
const volva = new THREE.Mesh(lathe([[0, 0], [.012, 0], [.016, .008], [.017, .02], [.0155, .026], [.0135, .02], [.012, .01], [.009, .004], [0, .004]], 32), mat(0xd9ccb2)); volva.position.y = .012; MG.add(volva);
// cổ nấm (vòng)
const ring = new THREE.Mesh(lathe([[.008, .0], [.012, -.002], [.019, -.012], [.0185, -.0135], [.011, -.004], [.0078, -.002]], 32), mat(0xf2ebde)); ring.position.y = .095; MG.add(ring);
// mũ nấm
const capP = []; for (let i = 0; i <= 20; i++) { const a = i / 20 * Math.PI / 2; capP.push([Math.sin(a) * .045, .108 + Math.cos(a) * .028]); } capP.push([.043, .104], [.036, .106], [.012, .11], [.0, .112]);
const cap = new THREE.Mesh(lathe(capP.reverse().concat([]).reverse(), 48), capM); MG.add(cap);
// vảy nấm
const scaleM = mat(0xb59c73, .9);
for (let i = 0; i < 60; i++) { const th = Math.acos(1 - Math.random() * .75), ph = Math.random() * 6.28; const sc = new THREE.Mesh(new THREE.CircleGeometry(.003 + Math.random() * .002, 6), scaleM); const x = Math.sin(th) * Math.cos(ph), y = Math.cos(th), z = Math.sin(th) * Math.sin(ph); sc.position.set(x * .0452, .108 + y * .0282, z * .0452); sc.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(x / .0452, y / .0282, z / .0452).normalize()); MG.add(sc); }
// phiến nấm
const gillM = mat(0xc8a98c, .8), gills = new THREE.Group(); MG.add(gills);
for (let i = 0; i < 90; i++) { const a = i / 90 * 6.283; const gs = new THREE.Shape(); gs.moveTo(.0095, 0); gs.lineTo(.043, 0); gs.quadraticCurveTo(.03, -.012, .0095, -.009); gs.closePath(); const gm = new THREE.Mesh(new THREE.ShapeGeometry(gs), gillM); gm.rotation.y = -a; gm.position.y = .106; gills.add(gm); }
// sợi nấm
const hyM = mat(0xf4f1ea, .9);
for (let i = 0; i < 26; i++) { const a = Math.random() * 6.28, r = .01 + Math.random() * .04; const pts = [new THREE.Vector3(Math.cos(a) * .008, .012, Math.sin(a) * .008)]; for (let k = 1; k <= 5; k++) pts.push(new THREE.Vector3(Math.cos(a + k * .15) * (.008 + r * k / 5), .012 - k * .0015, Math.sin(a + k * .15) * (.008 + r * k / 5))); const t = new THREE.Mesh(tubeAlong(pts, .0006, 24), hyM); MG.add(t); }
// mặt cắt dọc (hiện khi bổ dọc)
const sec = new THREE.Group(); sec.visible = false; MG.add(sec);
const flat = (shape, c, z) => { const m = new THREE.Mesh(new THREE.ShapeGeometry(shape, 24), new THREE.MeshStandardMaterial({ color: c, roughness: .8, side: THREE.DoubleSide })); m.position.z = z; sec.add(m); };
const s1 = new THREE.Shape(); s1.moveTo(-.0088, .018); s1.lineTo(.0088, .018); s1.lineTo(.0076, .104); s1.lineTo(.036, .106); s1.lineTo(.044, .106);
s1.absellipse(0, .108, .045, .028, 0, Math.PI, false); s1.lineTo(-.036, .106); s1.lineTo(-.0076, .104); s1.closePath(); flat(s1, 0xeee0c6, .0002);
for (const sx of [-1, 1]) { const gs = new THREE.Shape(); gs.moveTo(sx * .0095, .106); gs.lineTo(sx * .043, .106); gs.quadraticCurveTo(sx * .03, .094, sx * .0095, .097); gs.closePath(); flat(gs, 0xb08d6c, .0004);
  for (let i = 0; i < 8; i++) { const ls = new THREE.Shape(), x = sx * (.012 + i * .004); ls.moveTo(x, .106); ls.lineTo(x + sx * .0006, .106); ls.lineTo(x + sx * .0006, .097 + Math.abs(x) * .05); ls.lineTo(x, .097 + Math.abs(x) * .05); flat(ls, 0x8d6a4c, .0006); } }
const vs = new THREE.Shape(); vs.moveTo(-.016, .012); vs.lineTo(.016, .012); vs.lineTo(.017, .032); vs.lineTo(.0135, .032); vs.lineTo(.0105, .016); vs.lineTo(-.0105, .016); vs.lineTo(-.0135, .032); vs.lineTo(-.017, .032); vs.closePath(); flat(vs, 0xd9ccb2, .0003);
sec.position.z = 0;
lab.shadow(MG);
const LB = [[cap, 'Mũ nấm', [-.05, .03, 0], 'cap'], [gills, 'Phiến nấm', [.055, .1, .0], 'gill'], [ring, 'Cổ nấm (vòng)', [.035, .0, 0], 'ring'], [stem, 'Cuống nấm', [-.03, .05, 0], 'stem'], [volva, 'Bao gốc', [.035, .01, 0], 'volva'], [soil, 'Sợi nấm (trong đất)', [-.065, .01, .02], 'hy'], [MG, 'Vảy nấm', [.02, .143, 0], 'sc']];
LB.forEach(([o, t, off]) => lab.label(o, t, off));
let cut = false, sawM = false;
$('#mush').onclick = () => { lab.view(...MU); sawM = true; mark(); };
$('#cut').onclick = () => { cut = !cut; clip.constant = cut ? -.05 : 10; sec.visible = cut; lab.view(cut ? [-.52, .15, .22] : MU[0], MU[1]); toast(cut ? 'Đã bổ dọc cây nấm: thấy rõ phiến nấm xếp toả tròn dưới mũ, cuống đặc ruột.' : 'Đã ghép lại.'); if (cut) sawM = 2; mark(); };
$('#go1').onclick = () => lab.view(...HOME);
function mark() { if (sawM) $('#r2').textContent = 'Mũ nấm (có vảy), phiến nấm, cổ nấm, cuống nấm, bao gốc, sợi nấm' + (sawM == 2 ? '; bổ dọc thấy phiến nấm mỏng xếp toả tròn dưới mũ' : ''); upd(); }
function upd() { hud.innerHTML = `Tiêu bản mốc: <b>${['chưa làm', 'đã gắp mốc', 'đã nhỏ nước', 'đã đậy lamen', 'trên bàn kính'][Math.min(W.S.step, 4)]}</b>${parts.size ? ' · đã nhận ra ' + parts.size + '/2 bộ phận' : ''}<br>Cây nấm: ${sawM ? (cut ? 'đang bổ dọc' : 'đã quan sát') : 'chưa quan sát'}`; }
$('#next').onclick = () => W.next(); $('#redo').onclick = () => { W.redo(); lab.view(...HOME); };
quiz($('#qz'), [
  { q: 'Quan sát nấm mốc dưới kính hiển vi thấy', o: ['các sợi nấm phân nhánh và túi bào tử màu đen', 'tế bào hình que', 'lục lạp', 'rễ, thân, lá'], a: 0 },
  { q: 'Bộ phận nằm ở mặt dưới mũ nấm, gồm nhiều lá mỏng xếp toả tròn là', o: ['phiến nấm', 'bao gốc', 'cuống nấm', 'vảy nấm'], a: 0 },
  { q: 'Cơ quan sinh sản của nấm mốc là', o: ['túi bào tử', 'sợi nấm', 'cuống nấm', 'rễ'], a: 0 },
  { q: 'Khi làm thí nghiệm với nấm mốc cần', o: ['đeo khẩu trang, găng tay, rửa tay sau khi làm', 'ngửi trực tiếp mốc', 'nếm thử', 'để mốc lên bàn ăn'], a: 0 },
  { q: 'Nấm mốc thường mọc trên', o: ['bánh mì, cơm, quả cam để lâu ngày nơi ẩm', 'kim loại khô', 'thuỷ tinh sạch', 'đá vôi khô'], a: 0 },
]);
upd(); ready(); window.dbg = { lab, W, MG };
</script></body></html>
