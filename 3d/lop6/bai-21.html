<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 21. Thực hành: Quan sát và phân biệt một số loại tế bào</title>
<link rel="stylesheet" href="../core/ui.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import { createLab, THREE, MAT, roundBox, clamp, lerp } from '../core/lab3d.js';
import { microscope, scopeUI } from '../core/microscope.js';
import { shell, ready, toast, quiz, $, showPane } from '../core/ui.js';

const stage = shell({
  title: 'Bài 21. Thực hành: Quan sát và phân biệt một số loại tế bào', sub: 'KHTN 6 – Kết nối tri thức',
  panes: [
    { id: 'p1', title: 'Hướng dẫn', html: `
<h3>1. Tế bào biểu bì hành tây</h3><ol id="st1">
<li>Tách một vảy hành, lột nhẹ lớp tế bào biểu bì (mặt trong) – vết cắt hình vuông 7 – 8 mm.</li>
<li>Nhỏ một giọt nước cất lên lam kính, đặt lớp biểu bì vào.</li>
<li>Đậy lamen (trượt từ một cạnh), dùng giấy thấm thấm nước thừa.</li>
<li>Đặt tiêu bản lên bàn kính, quan sát ở vật kính 10x rồi chuyển sang 40x.</li></ol>
<div class="row"><button class="btn p" id="next">Làm bước tiếp theo</button><button class="btn" id="redo">Làm lại tiêu bản</button></div>
<h3>2. Tế bào trứng cá</h3><ol><li>Dùng thìa lấy một ít trứng cá cho vào đĩa petri.</li><li>Nhỏ một ít nước vào đĩa.</li><li>Dùng kim mũi mác khoảng nhẹ để trứng tách rời nhau.</li><li>Quan sát bằng mắt thường hoặc kính lúp.</li></ol>
<div class="row"><button class="btn p" id="egg">Làm thí nghiệm trứng cá</button><button class="btn" id="lup">Xem qua kính lúp</button></div>` },
    { id: 'p2', title: 'Kết quả', html: `<table class="dt"><thead><tr><th></th><th>Tế bào hành tây</th><th>Tế bào trứng cá</th></tr></thead><tbody>
<tr><td>Thành phần quan sát được</td><td id="r1">?</td><td id="r2">?</td></tr>
<tr><td>Thành phần không quan sát được</td><td id="r3">?</td><td id="r4">?</td></tr>
<tr><td>Cách quan sát</td><td>Kính hiển vi (nhỏ)</td><td>Mắt thường / kính lúp (lớn)</td></tr></tbody></table>
<div class="note">Cả hai loại tế bào đều có <b>màng tế bào, tế bào chất, nhân</b>. Tế bào hành tây có <b>thành (vách) tế bào</b>, xếp sát nhau như những viên gạch; tế bào trứng cá hình cầu, tách rời, không có thành tế bào.</div>` },
    { id: 'p3', title: 'Câu hỏi', html: `<div id="qz"></div>` },
  ]
});
const HOME = [[0, .42, .55], [0, .08, 0]];
const lab = createLab(stage, { cam: HOME[0], target: HOME[1], table: 'bench', tableSize: [1.2, .8], minDist: .05 });
const { scene } = lab;
const hud = document.createElement('div'); hud.className = 'hud'; stage.appendChild(hud);
const M = microscope(lab, stage, [.2, 0, -.05], { sample: 'onion', stain: 'none', onChange: () => check() });
M.g.rotation.y = -.35;
const tb = document.createElement('div'); tb.className = 'tb'; stage.appendChild(tb); scopeUI(M, tb);

// ---- dụng cụ làm tiêu bản ----
const glassM = MAT.glassLite({ opacity: .45, color: 0xdff3ff });
const slide = new THREE.Group(); scene.add(slide); slide.position.set(-.12, .002, .08);
slide.add(new THREE.Mesh(new THREE.BoxGeometry(.075, .0012, .025), glassM));
const drop = new THREE.Mesh(new THREE.SphereGeometry(.004, 20, 10, 0, 6.3, 0, 1.2), MAT.glassLite({ opacity: .5, color: 0xcfefff })); drop.scale.y = .35; drop.position.y = .0006; drop.visible = false; slide.add(drop);
const film = new THREE.Mesh(new THREE.BoxGeometry(.0075, .0002, .0075), new THREE.MeshStandardMaterial({ color: 0xf2ecd2, transparent: true, opacity: .75, roughness: .4 })); film.position.y = .0009; film.visible = false; slide.add(film);
const cover = new THREE.Mesh(new THREE.BoxGeometry(.018, .0004, .018), MAT.glassLite({ opacity: .35 })); cover.visible = false; slide.add(cover);
lab.label(slide, 'Lam kính', [-.03, .006, .01]);
// củ hành bổ đôi
const onion = new THREE.Group(); onion.position.set(-.3, 0, .02); scene.add(onion);
const ogeo = new THREE.SphereGeometry(.04, 32, 16, 0, Math.PI); ogeo.scale(1, 1.1, 1);
const half = new THREE.Mesh(ogeo, new THREE.MeshStandardMaterial({ color: 0xc7865a, roughness: .6, side: THREE.DoubleSide })); half.rotation.x = -Math.PI / 2; half.position.y = .0; onion.add(half);
for (let i = 1; i <= 5; i++) { const r = .04 - i * .007; const ring = new THREE.Mesh(new THREE.RingGeometry(r - .0015, r, 48, 1, 0, Math.PI), new THREE.MeshStandardMaterial({ color: i % 2 ? 0xf3ead2 : 0xe8dcbc, side: THREE.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.scale.y = 1.1; ring.position.y = .0005; onion.add(ring); }
const face = new THREE.Mesh(new THREE.CircleGeometry(.04, 48, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0xfaf3e0, roughness: .5 })); face.rotation.x = -Math.PI / 2; face.scale.y = 1.1; face.position.y = .0003; onion.add(face);
lab.label(onion, 'Củ hành tây', [0, .03, 0]);
// panh (kẹp)
const tw = new THREE.Group(); scene.add(tw); tw.position.set(-.22, .004, .14); tw.rotation.y = .5;
for (const s of [-1, 1]) { const a = new THREE.Mesh(new THREE.BoxGeometry(.11, .002, .005), MAT.metal(0xd9dde2, .25)); a.position.set(0, .0, s * .003); a.rotation.y = s * .03; tw.add(a); }
const twFilm = film.clone(); twFilm.position.set(-.056, -.002, 0); twFilm.visible = false; tw.add(twFilm);
lab.label(tw, 'Panh', [.04, .01, 0]);
// ống nhỏ giọt
const drp = new THREE.Group(); scene.add(drp); drp.position.set(-.04, .01, .17); drp.rotation.z = Math.PI / 2;
const dg = new THREE.Mesh(new THREE.CylinderGeometry(.004, .0015, .08, 16), MAT.glassLite({ opacity: .4 })); drp.add(dg);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(.007, 16, 12), MAT.plastic(0xd9480f, .6)); bulb.scale.y = 1.8; bulb.position.y = .048; drp.add(bulb);
lab.label(drp, 'Ống nhỏ giọt (nước cất)', [0, .02, 0]);
// lamen + giấy thấm
const lamen = new THREE.Mesh(new THREE.BoxGeometry(.018, .0004, .018), MAT.glassLite({ opacity: .4 })); lamen.position.set(-.04, .0003, .04); scene.add(lamen); lab.label(lamen, 'Lamen', [0, .01, 0]);
const paper = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .0006, 40), new THREE.MeshStandardMaterial({ color: 0xfdfcf7, roughness: 1 })); paper.position.set(-.04, .0003, -.06); scene.add(paper); lab.label(paper, 'Giấy thấm', [0, .01, 0]);
// đĩa petri + trứng cá
const petri = new THREE.Group(); petri.position.set(-.27, 0, -.12); scene.add(petri);
const pd = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .012, 48, 1, true), MAT.glassLite({ opacity: .3 })); pd.position.y = .006; petri.add(pd);
const pb = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .001, 48), new THREE.MeshStandardMaterial({ color: 0xf4fbff, transparent: true, opacity: .25, roughness: .2, envMapIntensity: .2 })); pb.position.y = .0005; petri.add(pb);
const water = new THREE.Mesh(new THREE.CylinderGeometry(.044, .044, .003, 48), new THREE.MeshPhysicalMaterial({ color: 0xd8eef8, transparent: true, opacity: .35, roughness: .05 })); water.position.y = .0025; water.visible = false; petri.add(water);
lab.label(petri, 'Đĩa petri', [0, .02, -.04]);
const NE = 70, eggG = new THREE.SphereGeometry(.0012, 16, 12);
const eggM = new THREE.MeshPhysicalMaterial({ color: 0xff6a00, roughness: .12, transparent: true, opacity: .8, clearcoat: 1, emissive: 0xc23a00, emissiveIntensity: .45, envMapIntensity: .6 });
const eggs = new THREE.InstancedMesh(eggG, eggM, NE); eggs.visible = false; petri.add(eggs);
const nuc = new THREE.InstancedMesh(new THREE.SphereGeometry(.0004, 10, 8), new THREE.MeshStandardMaterial({ color: 0xb33a00, roughness: .5 }), NE); nuc.visible = false; petri.add(nuc);
const E = [...Array(NE)].map((_, i) => { const a = i * 2.4, r = .0012 * 1.9 * Math.sqrt(i) * .55; return { c: [Math.cos(a) * r, Math.sin(a) * r], s: [(Math.random() - .5) * .07, (Math.random() - .5) * .07] }; });
E.forEach(e => { const L = Math.hypot(...e.s); if (L > .036) e.s = e.s.map(v => v * .036 / L); });
let spread = 0; const dm = new THREE.Object3D();
function placeEggs() { E.forEach((e, i) => { const x = lerp(e.c[0], e.s[0], spread), z = lerp(e.c[1], e.s[1], spread); dm.position.set(x, .0013 + (1 - spread) * (i % 3) * .0009, z); dm.updateMatrix(); eggs.setMatrixAt(i, dm.matrix); dm.position.x += .0003; dm.position.y += .00065; dm.updateMatrix(); nuc.setMatrixAt(i, dm.matrix); }); eggs.instanceMatrix.needsUpdate = nuc.instanceMatrix.needsUpdate = true; }
placeEggs();
const needle = new THREE.Mesh(new THREE.CylinderGeometry(.0008, .0001, .09, 8), MAT.metal(0xdddddd, .2)); needle.rotation.z = 1.2; needle.position.set(-.18, .03, -.1); needle.visible = false; scene.add(needle);
lab.shadow(onion); lab.shadow(tw); lab.shadow(drp);

// ---- hoạt cảnh đơn giản ----
const anims = [];
function tween(dur, f, done) { anims.push({ t: 0, dur, f, done }); }
lab.onTick(dt => { for (let i = anims.length - 1; i >= 0; i--) { const a = anims[i]; a.t = Math.min(a.dur, a.t + dt); const k = a.t / a.dur, e = k * k * (3 - 2 * k); a.f(e); if (a.t >= a.dur) { anims.splice(i, 1); a.done && a.done(); } } });
const moveTo = (o, to, dur, done) => { const p0 = o.position.clone(), p1 = new THREE.Vector3(...to); tween(dur, e => o.position.lerpVectors(p0, p1, e), done); };
let step = 0, busy = false, onStage = false;
const TW0 = tw.position.clone(), DR0 = drp.position.clone(), LM0 = lamen.position.clone(), SL0 = slide.position.clone(), PP0 = paper.position.clone();
function mark(n) { document.querySelectorAll('#st1 li').forEach((li, i) => li.style.color = i < n ? '#2f9e44' : ''); }
const STEPS = [
  () => { lab.view([-.25, .2, .2], [-.25, .0, .05]); moveTo(tw, [-.3, .03, .02], .8, () => { twFilm.visible = true; toast('Đã lột được lớp biểu bì mỏng, trong suốt'); moveTo(tw, TW0.toArray(), .7, end); }); },
  () => { lab.view([-.1, .16, .2], [-.12, 0, .08]); moveTo(drp, [-.12, .05, .08], .7, () => { drp.rotation.z = 0; drop.visible = true; drp.rotation.z = Math.PI / 2; moveTo(drp, DR0.toArray(), .5); moveTo(tw, [-.064, .006, .1], .7, () => { twFilm.visible = false; film.visible = true; moveTo(tw, TW0.toArray(), .6, end); }); }); },
  () => { lamen.rotation.z = .5; moveTo(lamen, [-.12 + .004, .008, .08], .7, () => { tween(.6, e => { lamen.rotation.z = .5 * (1 - e); lamen.position.y = lerp(.008, .0028, e); }, () => { lamen.visible = false; cover.visible = true; cover.position.y = .0012; drop.scale.set(1.6, .2, 1.6);
    moveTo(paper, [-.12 + .045, .003, .08], .6, () => { drop.scale.set(1.1, .12, 1.1); toast('Đã thấm bớt nước thừa'); moveTo(paper, PP0.toArray(), .5, end); }); }); }); },
  () => { moveTo(slide, [M.g.position.x + .006, .12, M.g.position.z + .03], .8, () => { slide.visible = false; onStage = true; M.slide(true); lab.view([.45, .3, .3], [.2, .13, -.05]); toast('Bật đèn, chọn vật kính 10x rồi lấy nét. Sau đó chuyển sang 40x.'); end(); }); },
];
function end() { busy = false; step++; mark(step); check(); }
$('#next').onclick = () => { if (busy) return; if (step >= STEPS.length) return toast('Tiêu bản đã ở trên kính hiển vi.'); busy = true; STEPS[step](); };
$('#redo').onclick = () => { if (busy) return; step = 0; mark(0); onStage = false; M.slide(false); slide.visible = true; slide.position.copy(SL0); drop.visible = film.visible = cover.visible = twFilm.visible = false; drop.scale.set(1, .35, 1); lamen.visible = true; lamen.position.copy(LM0); lamen.rotation.z = 0; lab.view(...HOME); };
const origSlide = M.slide; M.slide = v => { if (!onStage && (v ?? !M.S.slide)) return toast('Hãy làm tiêu bản trước (bấm “Làm bước tiếp theo”).'); origSlide(v); };
// trứng cá
let eggStep = 0;
$('#egg').onclick = () => { if (busy) return; lab.view([-.27, .17, .07], [-.27, 0, -.12]); busy = true;
  if (eggStep == 0) { eggs.visible = nuc.visible = true; spread = 0; placeEggs(); toast('Bước 1: Cho trứng cá vào đĩa petri'); eggStep = 1; busy = false; }
  else if (eggStep == 1) { water.visible = true; toast('Bước 2: Nhỏ một ít nước vào đĩa'); eggStep = 2; busy = false; }
  else if (eggStep == 2) { needle.visible = true; tween(2.2, e => { spread = e; placeEggs(); needle.position.set(-.27 + Math.sin(e * 12) * .02, .012, -.12 + Math.cos(e * 9) * .02); }, () => { needle.visible = false; busy = false; eggStep = 3; toast('Bước 3: Trứng đã tách rời nhau. Hãy xem qua kính lúp.'); check(); }); }
  else { busy = false; toast('Bấm “Xem qua kính lúp”.'); } };
let seenEgg = false;
$('#lup').onclick = () => { if (eggStep < 3) return toast('Làm thí nghiệm trứng cá trước.'); lab.view([-.27, .065, -.07], [-.27, 0, -.12]); seenEgg = true; check(); toast('Mỗi quả trứng cá là một tế bào: thấy màng, tế bào chất trong suốt và nhân (chấm đậm).'); };
let seen10 = false, seen40 = false;
function check() {
  const S = M.S;
  if (S.view && S.sharp && onStage) { if (S.obj == 0 && !seen10) { seen10 = true; toast('Đã thấy tế bào hành ở 100 lần. Chuyển sang vật kính 40x.'); } if (S.obj == 1 && !seen40) { seen40 = true; toast('Ở 400 lần thấy rõ vách tế bào và nhân.'); mark(4); } }
  if (seen40) { $('#r1').textContent = 'Thành tế bào, màng tế bào, tế bào chất, nhân'; $('#r3').textContent = 'Lục lạp (không có), chi tiết bên trong nhân'; }
  if (seenEgg) { $('#r2').textContent = 'Màng tế bào, tế bào chất, nhân'; $('#r4').textContent = 'Thành tế bào (không có)'; }
  hud.innerHTML = `Tiêu bản hành: <b>${['chưa làm', 'đã lột biểu bì', 'đã đặt lên lam kính', 'đã đậy lamen', 'trên bàn kính'][Math.min(step, 4)]}</b><br>Quan sát 10x: ${seen10 ? '✔' : '–'} · 40x: ${seen40 ? '✔' : '–'} · Trứng cá: ${seenEgg ? '✔' : '–'}`;
}
lab.onTick(() => { if (M.S.view) check(); });
quiz($('#qz'), [
  { q: 'Thành phần quan sát được ở cả tế bào hành tây và tế bào trứng cá là', o: ['Thành tế bào, lục lạp', 'Màng tế bào, tế bào chất, nhân', 'Chỉ có nhân', 'Không bào lớn'], a: 1 },
  { q: 'Đặc điểm giúp phân biệt tế bào hành tây với tế bào trứng cá là', o: ['Tế bào hành có thành tế bào, xếp sát nhau', 'Tế bào hành có nhân', 'Tế bào trứng cá có màng', 'Tế bào trứng cá nhỏ hơn'], a: 0 },
  { q: 'Vì sao quan sát được tế bào trứng cá bằng mắt thường?', o: ['Vì tế bào trứng cá có kích thước lớn', 'Vì có màu cam', 'Vì có nhiều nước', 'Vì có thành tế bào'], a: 0 },
  { q: 'Khi đậy lamen nên', o: ['Ấn mạnh xuống', 'Đặt một cạnh lamen chạm giọt nước rồi hạ từ từ để không có bọt khí', 'Thả rơi từ trên cao', 'Không cần đậy'], a: 1 },
  { q: 'Dùng giấy thấm để', o: ['Lau vật kính', 'Thấm bớt nước thừa quanh lamen', 'Nhuộm tế bào', 'Che ánh sáng'], a: 1 },
]);
check(); ready(); window.dbg = { lab, M, next: () => $('#next').click() };
</script></body></html>
